name: Update dashboard

on:
  schedule:
    # GitHub Actions cron always runs in UTC, with no timezone setting.
    # Moscow is UTC+3 year-round (no DST), so 08:00-19:00 MSK, Mon-Fri
    # is 05:00-16:00 UTC, Mon-Fri here.
    - cron: "5,35 5-16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build dashboard
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: python3 scripts/build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update dashboard data"
          git push
