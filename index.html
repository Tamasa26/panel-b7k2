<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Продажи PERTiX</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=VT323&display=swap">
<style>
  :root{
    /* retro OS palette: periwinkle grid, cream windows, brown ink */
    --bg:#cddcf6;
    --grid:#ffffff;
    --panel:#fbe4cc;
    --panel-2:#f3d2ae;
    --ink:#3b2a2e;
    --muted:#7d636a;
    --border:#3b2a2e;
    --teal:#5fb4a8;
    --orange:#ee8a2d;
    --title-ink:#3b2a2e;
    --blue:#6f8ae6;
    --good:#66cc74;
    --warn:#f0c95c;
    --bad:#ee6368;
    --pill-ink:#2a1c20;
    --gold:#f0c95c;
    --shadow-c:rgba(59,42,46,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1d2146;
      --grid:rgba(255,255,255,.07);
      --panel:#322e58;
      --panel-2:#26234a;
      --ink:#f6e7d4;
      --muted:#b9aac0;
      --border:#0d0e2a;
      --teal:#3f9b90;
      --orange:#d9782a;
      --title-ink:#10122c;
      --blue:#7b94e8;
      --shadow-c:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1d2146;
    --grid:rgba(255,255,255,.07);
    --panel:#322e58;
    --panel-2:#26234a;
    --ink:#f6e7d4;
    --muted:#b9aac0;
    --border:#0d0e2a;
    --teal:#3f9b90;
    --orange:#d9782a;
    --title-ink:#10122c;
    --blue:#7b94e8;
    --shadow-c:rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(var(--grid) 2px, transparent 2px),
      linear-gradient(90deg, var(--grid) 2px, transparent 2px);
    background-size:32px 32px;
    background-position:-1px -1px;
    color:var(--ink);
    font-family:"Pixelify Sans","VT323",ui-monospace,Menlo,monospace;
    font-size:15px;
    line-height:1.25;
  }
  .num{ font-variant-numeric:tabular-nums; }
  /* Pixelify Sans draws 5 and 3 like S and 8 — digits get VT323, which has
     unambiguous numerals (words stay in Pixelify, which has Cyrillic). */
  .d{
    font-family:"VT323","Pixelify Sans",ui-monospace,monospace;
    font-size:1.4em;
    line-height:.8;
    letter-spacing:.02em;
    font-weight:400;
  }
  .page{
    max-width:1280px;
    margin:0 auto;
    padding:24px 24px 40px;
  }

  /* ---- window chrome ---- */
  .win{
    background:var(--panel);
    border:2px solid var(--border);
    border-radius:4px;
    box-shadow:4px 4px 0 var(--shadow-c);
    overflow:hidden;
    min-width:0;
  }
  .tb{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    height:26px;
    padding:0 8px 0 10px;
    border-bottom:2px solid var(--border);
    background:var(--teal);
    color:var(--title-ink);
  }
  .tb.orange{ background:var(--orange); }
  .tb-title{
    margin:0;
    font-size:14px;
    font-weight:600;
    letter-spacing:.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .wbtns{ flex:none; width:40px; height:8px; display:block; }
  .wbody{ padding:14px 16px; }

  /* ---- header ---- */
  .header-win{ margin-bottom:22px; }
  .header-body{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:12px 16px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .logo{ display:block; line-height:0; }
  .tagline{ margin:0; font-size:15px; }
  .meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .month-badge{
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    background:var(--blue);
    border:2px solid var(--border);
    border-radius:3px;
    padding:3px 10px;
  }
  .updated{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:var(--muted);
  }
  .updated .dot{
    box-sizing:content-box;
    width:6px; height:6px;
    background:var(--good);
    border:2px solid var(--border);
    flex:none;
  }
  .updated.stale .dot{ background:var(--warn); }

  /* ---- department windows ---- */
  .depts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    margin-bottom:22px;
    align-items:start;
  }
  @media (max-width:860px){
    .depts{ grid-template-columns:1fr; }
  }
  .dept-col{
    display:flex;
    flex-direction:column;
    gap:22px;
    min-width:0;
  }
  .dept-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding-bottom:12px;
    margin-bottom:4px;
    border-bottom:2px dashed var(--border);
  }
  .dept-sub{ font-size:14px; color:var(--muted); }

  .pct-pill{
    flex:none;
    font-family:"VT323","Pixelify Sans",monospace;
    font-weight:400;
    font-size:21px;
    line-height:1;
    padding:2px 9px 1px;
    border:2px solid var(--border);
    border-radius:3px;
    color:var(--pill-ink);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .pct-pill.big{ font-size:27px; padding:3px 12px 2px; }
  .pct-good{ background:var(--good); }
  .pct-warn{ background:var(--warn); }
  .pct-bad { background:var(--bad); }

  .mgr-row{
    display:grid;
    grid-template-columns:104px 1fr auto;
    align-items:center;
    gap:14px;
    padding:11px 0;
    border-bottom:2px dashed color-mix(in srgb, var(--border) 28%, transparent);
  }
  .mgr-row:last-child{ border-bottom:none; padding-bottom:2px; }
  .mgr-name{
    font-weight:700;
    font-size:16px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .px-bar{
    height:18px;
    border:2px solid var(--border);
    border-radius:3px;
    background:var(--panel-2);
    padding:2px;
  }
  .px-fill{
    height:100%;
    background:repeating-linear-gradient(90deg, var(--c) 0 9px, transparent 9px 12px);
  }
  .mgr-figures{
    margin-top:5px;
    font-size:13px;
    color:var(--muted);
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .pct-cell{
    display:flex;
    align-items:center;
    gap:8px;
    justify-self:end;
  }
  @media (max-width:520px){
    .mgr-row{ grid-template-columns:1fr; row-gap:6px; }
    .pct-cell{ justify-self:start; }
  }

  /* ---- pixel sprites ---- */
  .sprite{ display:block; image-rendering:pixelated; }
  .fire-icon{ animation:flame .6s steps(1,end) infinite; }
  @keyframes flame{
    0%  { transform:translateY(0); }
    50% { transform:translateY(-2px); }
  }
  @media (prefers-reduced-motion: reduce){
    .fire-icon{ animation:none; }
  }

  /* ---- stat windows ---- */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:22px;
  }
  @media (max-width:920px){
    .stats{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:560px){
    .stats{ grid-template-columns:1fr; }
  }
  .mini-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
  }
  @media (max-width:520px){
    .mini-stats{ grid-template-columns:1fr; }
  }
  .stat-body{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .slot{
    flex:none;
    width:66px; height:66px;
    background:var(--panel-2);
    border:2px solid var(--border);
    border-radius:3px;
    display:grid;
    place-items:center;
  }
  .stat-number{
    font-family:"VT323","Pixelify Sans",monospace;
    font-weight:400;
    font-size:60px;
    line-height:.85;
    font-variant-numeric:tabular-nums;
  }
  .stat-bad .stat-number{ color:#d2383d; }
  :root[data-theme="dark"] .stat-bad .stat-number{ color:#ff8a8e; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .stat-bad .stat-number{ color:#ff8a8e; }
  }
  .stat-sub{
    margin-top:8px;
    font-family:"VT323","Pixelify Sans",monospace;
    font-size:22px;
    line-height:1;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---- gauge ---- */
  .gauge-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:12px 16px 12px;
  }
  .gauge-body svg{ width:100%; max-width:168px; height:auto; display:block; }
  .gauge-value{
    font-family:"VT323","Pixelify Sans",monospace;
    font-weight:400;
    font-size:34px;
    line-height:.9;
    font-variant-numeric:tabular-nums;
  }
  .gauge-needle{ transition:transform .6s steps(12,end); }
</style>

<div class="page">
  <section class="win header-win">
    <div class="tb orange">
      <h1 class="tb-title">PERTiX</h1>
      <span data-wbtns></span>
    </div>
    <div class="wbody header-body">
      <div class="brand">
        <span class="logo" data-sprite="logo"></span>
        <p class="tagline">Продажи · нарастающим итогом с начала года</p>
      </div>
      <div class="meta">
        <div class="month-badge" id="monthBadge">—</div>
        <div class="updated" id="updated"><span class="dot"></span><span id="updatedText">—</span></div>
      </div>
    </div>
  </section>

  <div class="depts" id="depts"></div>

  <div class="stats">
    <section class="win">
      <div class="tb"><h3 class="tb-title">Отгрузок с начала года</h3><span data-wbtns></span></div>
      <div class="wbody stat-body">
        <div class="slot" data-sprite="box"></div>
        <div class="stat-number num" id="shipmentsCount">—</div>
      </div>
    </section>
    <section class="win">
      <div class="tb"><h3 class="tb-title">В производстве сейчас</h3><span data-wbtns></span></div>
      <div class="wbody stat-body">
        <div class="slot" data-sprite="hourglass"></div>
        <div>
          <div class="stat-number num" id="productionCount">—</div>
          <div class="stat-sub num" id="productionSum">—</div>
        </div>
      </div>
    </section>
    <section class="win stat-bad">
      <div class="tb orange"><h3 class="tb-title">Несвоевременных отгрузок</h3><span data-wbtns></span></div>
      <div class="wbody stat-body">
        <div class="slot" data-sprite="boxwarn"></div>
        <div class="stat-number num" id="lateShipmentsCount">—</div>
      </div>
    </section>
  </div>
</div>

<script>
  const DATA = {"updatedAt": "2026-10-27T13:27:06.982821+03:00", "currentMonth": "Октябрь", "departments": [{"name": "ГОСТ", "managers": [{"name": "Угольников", "plan": 51500000, "fact": 54620952, "pct": 106.1}, {"name": "Филаретова", "plan": 37655000, "fact": 46539560, "pct": 123.6}, {"name": "Муканян", "plan": 1000000, "fact": 860000, "pct": 86.0}]}, {"name": "Проектный", "managers": [{"name": "Якунин", "plan": 75325000, "fact": 47813921, "pct": 63.5}, {"name": "Роганин", "plan": 67000000, "fact": 12535743, "pct": 18.7}, {"name": "Маркова", "plan": 67000000, "fact": 49155252, "pct": 73.4}, {"name": "Малашкин", "plan": 67000000, "fact": 80908930, "pct": 120.8}, {"name": "Извекова", "plan": 28500000, "fact": 40784473, "pct": 143.1}, {"name": "Ерицян", "plan": 28500000, "fact": 21144610, "pct": 74.2}]}], "shipments": {"count": 633}, "lateShipments": {"count": 60}, "production": {"count": 30, "sum": 30046252}, "leadGen": {"totalInquiries": 550, "conversionPct": 34.7, "month": "Октябрь"}, "sourceUpdatedAt": "2026-10-27T12:27:48+03:00"};

  function fmtMoney(n){
    return new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₽';
  }
  function fmtPct(p){
    return p.toLocaleString('ru-RU', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  function fmtInt(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
  }
  function tier(p){
    if (p < 70) return 'bad';
    if (p < 90) return 'warn';
    return 'good';
  }

  // wrap runs of digits (and their separators) so they render in the digit font
  function dg(str){
    return String(str).replace(/[0-9][0-9\s\u00a0:.,%]*[0-9%]|[0-9]/g, m => '<span class="d">' + m + '</span>');
  }

  /* ---------- pixel sprites ---------- */
  const PAL = {
    K:'#3b2a2e', R:'#e8575a', O:'#ee8a2d', Y:'#f0c95c', W:'#fff3e0',
    B:'#d99a5b', L:'#ecc08a', G:'#8d7f86'
  };
  function rectsOf(grid, ox, oy){
    let out = '';
    grid.forEach((row, y) => {
      for (let x = 0; x < row.length; x++){
        const c = row[x];
        if (c === '.') continue;
        out += `<rect x="${x+ox}" y="${y+oy}" width="1.04" height="1.04" fill="${PAL[c]}"/>`;
      }
    });
    return out;
  }
  function spriteSVG(w, h, px, inner, cls){
    return `<svg class="sprite ${cls||''}" width="${w*px}" height="${h*px}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${inner}</svg>`;
  }

  const G_FLAME = [
    "....KK....",
    "...KRRK...",
    "...KRRRK..",
    "..KRRORRK.",
    "..KRORRRK.",
    ".KRROORRRK",
    ".KRORYORRK",
    "KRROOYOORK",
    "KRROYYYORK",
    "KRROYYYORK",
    ".KROYYYORK",
    ".KRROOORK.",
    "..KRRRRK..",
    "...KKKK..."
  ];
  const G_BOX = [
    "KKKKKKKKKKK",
    "KLLLLLLLLLK",
    "KKKKKKKKKKK",
    "KBBBGGGBBBK",
    "KBBBGGGBBBK",
    "KBBBBBBBBBK",
    "KBBBBBBBBBK",
    "KBBBBBBBBBK",
    "KKKKKKKKKKK"
  ];
  const G_WARN = [
    ".....KK.....",
    "....KYYK....",
    "....KYYK....",
    "...KYKKYK...",
    "...KYKKYK...",
    "..KYYKKYYK..",
    "..KYYKKYYK..",
    ".KYYYYYYYYK.",
    ".KYYYKKYYYK.",
    "KYYYYYYYYYYK",
    "KKKKKKKKKKKK"
  ];
  const G_HOURGLASS = [
    "KKKKKKKKK",
    "KWWWWWWWK",
    ".KWWWWWK.",
    "..KYYYK..",
    "...KYK...",
    "....K....",
    "...KYK...",
    "..KYYYK..",
    ".KYYYYYK.",
    "KYYYYYYYK",
    "KKKKKKKKK"
  ];
  const G_BUBBLE = [
    "..KKKKKKKKKKK..",
    ".KRRRRRRRRRRRK.",
    "KRRRRRRRRRRRRRK",
    "KRRRRWWRWWRRRRK",
    "KRRRWWWWWWWRRRK",
    "KRRRWWWWWWWRRRK",
    "KRRRRWWWWWRRRRK",
    "KRRRRRWWWRRRRRK",
    "KRRRRRRWRRRRRRK",
    "KRRRRRRRRRRRRRK",
    ".KRRRRRRRRRRRK.",
    "..KKKKKKKKKKK..",
    "..KRK..........",
    "..KK..........."
  ];
  const G_LOGO = [
    "KKKKKKKKKKKK",
    "KRRRRRRRRRRK",
    "KRWWWWWWWWRK",
    "KRWWWWWWWWRK",
    "KRRRRWWRRRRK",
    "KRRRRWWRRRRK",
    "KRRRRWWRRRRK",
    "KRRRRWWRRRRK",
    "KRRRRWWRRRRK",
    "KRRRRRRRRRRK",
    "KRRRRRRRRRRK",
    "KKKKKKKKKKKK"
  ];

  const SPRITES = {
    flame:     () => spriteSVG(10, 14, 2.4, rectsOf(G_FLAME,0,0), 'fire-icon'),
    box:       () => spriteSVG(11, 9, 4, rectsOf(G_BOX,0,0)),
    boxwarn:   () => spriteSVG(19, 15, 3, rectsOf(G_BOX,0,0) + rectsOf(G_WARN,7,4)),
    hourglass: () => spriteSVG(9, 11, 4, rectsOf(G_HOURGLASS,0,0)),
    bubble:    () => spriteSVG(15, 14, 3, rectsOf(G_BUBBLE,0,0)),
    logo:      () => spriteSVG(12, 12, 3, rectsOf(G_LOGO,0,0))
  };

  const WBTNS = `<svg class="wbtns" viewBox="0 0 40 8" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="0" y="6" width="8" height="2" fill="currentColor"/>
    <rect x="16" y="1" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M31 0h2v2h-2zM37 0h2v2h-2zM33 2h4v4h-4zM31 6h2v2h-2zM37 6h2v2h-2z" fill="currentColor"/>
  </svg>`;

  function initStatic(){
    document.querySelectorAll('[data-sprite]').forEach(el => {
      const f = SPRITES[el.dataset.sprite];
      if (f) el.innerHTML = f();
    });
    document.querySelectorAll('[data-wbtns]').forEach(el => { el.outerHTML = WBTNS; });
  }

  /* ---------- department windows ---------- */
  function renderDept(dept){
    const totalPlan = dept.managers.reduce((s,m)=>s+m.plan,0);
    const totalFact = dept.managers.reduce((s,m)=>s+m.fact,0);
    const totalPct = totalPlan ? (totalFact/totalPlan*100) : 0;
    const tTier = tier(totalPct);

    const rows = dept.managers.map(m => {
      const t = tier(m.pct);
      const width = Math.min(m.pct, 100);
      return `
        <div class="mgr-row">
          <div class="mgr-name">${m.name}</div>
          <div>
            <div class="px-bar"><div class="px-fill" style="width:${width}%;--c:var(--${t})"></div></div>
            <div class="mgr-figures num"><span>${dg('план ' + fmtMoney(m.plan))}</span><span>&rarr; ${dg('факт ' + fmtMoney(m.fact))}</span></div>
          </div>
          <div class="pct-cell">
            ${t === 'good' ? SPRITES.flame() : ''}
            <div class="pct-pill pct-${t}">${fmtPct(m.pct)}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <section class="win">
        <div class="tb"><h2 class="tb-title">${dept.name}</h2>${WBTNS}</div>
        <div class="wbody">
          <div class="dept-summary">
            <div class="dept-sub num">${dg('план ' + fmtMoney(totalPlan))} &middot; ${dg('факт ' + fmtMoney(totalFact))}</div>
            <div class="pct-pill big pct-${tTier}">${fmtPct(totalPct)}</div>
          </div>
          ${rows}
        </div>
      </section>`;
  }

  /* ---------- gauge (0-45%: red / yellow / green) ---------- */
  let gaugeSeq = 0;
  function gaugeSVG(valuePct){
    const max = 45;
    const clamped = Math.max(0, Math.min(valuePct, max));
    const deg = (clamped / max) * 180 - 90;
    const gradId = 'gauge-grad-' + (gaugeSeq++);
    return `
      <svg viewBox="0 0 120 68" aria-hidden="true">
        <defs>
          <linearGradient id="${gradId}" gradientUnits="userSpaceOnUse" x1="10" y1="60" x2="110" y2="60">
            <stop offset="0%" stop-color="#ee6368"/>
            <stop offset="28%" stop-color="#ee8a2d"/>
            <stop offset="52%" stop-color="#f0c95c"/>
            <stop offset="76%" stop-color="#b6d86a"/>
            <stop offset="100%" stop-color="#66cc74"/>
          </linearGradient>
        </defs>
        <path d="M8,60 A52,52 0 0,1 112,60" fill="none" stroke="var(--border)" stroke-width="16"/>
        <path d="M10,60 A50,50 0 0,1 110,60" fill="none" stroke="url(#${gradId})" stroke-width="11"/>
        <line class="gauge-needle" x1="60" y1="60" x2="60" y2="20" stroke="var(--border)" stroke-width="4" transform="rotate(${deg} 60 60)"/>
        <rect x="54" y="54" width="12" height="12" fill="var(--border)"/>
        <rect x="57" y="57" width="6" height="6" fill="var(--panel)"/>
      </svg>`;
  }

  const MONTH_SHORT = {
    'Январь':'янв', 'Февраль':'февр', 'Март':'март', 'Апрель':'апр',
    'Май':'май', 'Июнь':'июнь', 'Июль':'июль', 'Август':'авг',
    'Сентябрь':'сент', 'Октябрь':'окт', 'Ноябрь':'нояб', 'Декабрь':'дек'
  };

  function renderMiniStats(data){
    const lg = data.leadGen || {totalInquiries: 0, conversionPct: 0};
    const monthTag = lg.month && MONTH_SHORT[lg.month] ? ' (' + MONTH_SHORT[lg.month] + ')' : '';
    return `
      <div class="mini-stats">
        <section class="win">
          <div class="tb"><h3 class="tb-title">Всего обращений${monthTag}</h3>${WBTNS}</div>
          <div class="wbody stat-body">
            <div class="slot">${SPRITES.bubble()}</div>
            <div class="stat-number num">${fmtInt(lg.totalInquiries)}</div>
          </div>
        </section>
        <section class="win">
          <div class="tb"><h3 class="tb-title">Конверсия лидов</h3>${WBTNS}</div>
          <div class="gauge-body">
            ${gaugeSVG(lg.conversionPct)}
            <div class="gauge-value num">${fmtPct(lg.conversionPct)}</div>
          </div>
        </section>
      </div>`;
  }

  function render(data){
    if (!data) return;
    document.getElementById('depts').innerHTML = data.departments.map(dept => {
      const card = renderDept(dept);
      const extra = dept.name === 'ГОСТ' ? renderMiniStats(data) : '';
      return `<div class="dept-col">${card}${extra}</div>`;
    }).join('');
    document.getElementById('shipmentsCount').textContent = fmtInt(data.shipments.count);
    document.getElementById('productionCount').textContent = fmtInt(data.production.count);
    document.getElementById('productionSum').textContent = fmtMoney(data.production.sum);
    document.getElementById('lateShipmentsCount').textContent = fmtInt(data.lateShipments.count);
    document.getElementById('monthBadge').textContent = 'Янв – ' + (data.currentMonth || '').slice(0,3).toLowerCase();

    const updatedAt = new Date(data.updatedAt);
    const fmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    document.getElementById('updatedText').innerHTML = dg('Обновлено ' + fmt.format(updatedAt));

    const staleMs = Date.now() - updatedAt.getTime();
    document.getElementById('updated').classList.toggle('stale', staleMs > 90*60*1000);
  }

  // GitHub Pages serves this file with a 10-minute CDN cache. A plain
  // visit/bookmark can land on a stale cached copy even right after a
  // fresh publish. If this load didn't already come from our own
  // cache-busted reload (no "?t=" param), immediately replace it with
  // one that has a unique query string, forcing a real network fetch.
  if (location.protocol.startsWith('http') && !location.search.includes('t=')) {
    location.replace(location.pathname + '?t=' + Date.now());
  }

  initStatic();
  render(DATA);
  setInterval(() => render(DATA), 60000);

  // The page itself is a static file — an open tab never sees a new
  // publish on its own. Reload from the network every 5 minutes (with a
  // cache-busting query so a CDN/browser cache can't serve the old file)
  // so a screen left open all day picks up each hourly update.
  setInterval(() => {
    window.location.href = window.location.pathname + '?t=' + Date.now();
  }, 5 * 60 * 1000);
</script>
