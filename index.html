<title>Продажи PERTiX</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Onest:wght@500;600;700;800&display=swap">
<style>
  :root{
    --bg:#edf2fa;
    --surface-2:#e9edf7;
    --card-cool:#f0f3ff;
    --card-mint:#eef8f5;
    --card-rose:#fff2f4;
    --icon-cool:#e0e7fb;
    --icon-mint:#d9f0e9;
    --icon-rose:#f8dee8;
    --surface:#ffffff;
    --ink:#20283e;
    --muted:#53627b;
    --line:#d9e2ef;
    --accent:#a14064;
    --accent-ink:#ffffff;
    --blue:#4d5da3;
    --good:#17694e; --good-bg:#e2f4eb;
    --warn:#815521; --warn-bg:#fff0d8;
    --bad:#a13658;  --bad-bg:#fce7ee;
    --radius-lg:22px;
    --radius-md:18px;
    --shadow:0 14px 38px rgba(50,67,111,.10), inset 0 1px 0 #fff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141b2d;
      --surface-2:#303d55;
      --card-cool:#242e49;
      --card-mint:#20363e;
      --card-rose:#382c43;
      --icon-cool:#36446d;
      --icon-mint:#2c514e;
      --icon-rose:#573650;
      --surface:#1d273d;
      --ink:#eff3fc;
      --muted:#b6c3d9;
      --line:#36445e;
      --accent:#f09eb7;
      --accent-ink:#ffffff;
      --blue:#adbaff;
      --good:#94e2c0; --good-bg:#223f3d;
      --warn:#f6cb85; --warn-bg:#46382c;
      --bad:#ffb2c6;  --bad-bg:#482b40;
      --shadow:0 16px 40px rgba(6,10,23,.26), inset 0 1px 0 #ffffff0d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141b2d;
    --surface-2:#303d55;
    --card-cool:#242e49;
    --card-mint:#20363e;
    --card-rose:#382c43;
    --icon-cool:#36446d;
    --icon-mint:#2c514e;
    --icon-rose:#573650;
    --surface:#1d273d;
    --ink:#eff3fc;
    --muted:#b6c3d9;
    --line:#36445e;
    --accent:#f09eb7;
    --accent-ink:#ffffff;
    --blue:#adbaff;
    --good:#94e2c0; --good-bg:#223f3d;
    --warn:#f6cb85; --warn-bg:#46382c;
    --bad:#ffb2c6;  --bad-bg:#482b40;
    --shadow:0 16px 40px rgba(6,10,23,.26), inset 0 1px 0 #ffffff0d;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Golos Text",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-weight:600; }
  .topband{ height:5px; background:var(--accent); }
  .page{
    max-width:1280px;
    margin:0 auto;
    padding:24px 24px 40px;
  }

  /* ---- header ---- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(145deg,#d46d8c,#9a486f 67%,#734576);
    box-shadow:0 5px 14px #a1406433, inset 0 1px 0 #ffffff55;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:24px;height:24px;color:var(--accent-ink);}
  .brand h1{
    font-family:"Onest","Golos Text",system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(30px,4vw,46px);
    line-height:1;
    letter-spacing:-.055em;
    margin:0 0 5px;
    text-wrap:balance;
  }
  .brand .tagline{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .month-badge{
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--blue);
    background:linear-gradient(135deg,var(--surface),var(--icon-cool));
    border:1px solid var(--line);
    padding:7px 13px;
    border-radius:999px;
  }
  .updated{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .updated .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--good);
    flex:none;
  }
  .updated.stale .dot{background:var(--warn);}

  /* ---- department cards ---- */
  .depts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
    align-items:start;
  }
  @media (max-width:860px){
    .depts{grid-template-columns:1fr;}
  }
  .dept-col{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .dept-card{
    background:linear-gradient(145deg,var(--surface) 30%,var(--card-cool));
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px 8px;
    box-shadow:var(--shadow);
  }

  .dept-col:first-child .dept-card{
    background:linear-gradient(145deg,var(--surface) 30%,var(--card-mint));
  }

  /* ---- mini stat tiles under the ГОСТ card ---- */
  .mini-stats{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:20px;
  }
  @media (max-width:520px){
    .mini-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .mini-stat:first-child{grid-column:1/-1;}
  }
  .mini-stat{
    background:linear-gradient(145deg,var(--surface) 30%,var(--card-cool));
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:8px;
  }
  .mini-stat:first-child{background:linear-gradient(145deg,var(--surface) 25%,var(--card-mint));}
  .mini-stat .stat-icon{ margin-bottom:2px; }
  .mini-stat .stat-label{ margin:0; }
  .mini-stat .stat-number{ font-size:30px; }
  .gauge-wrap{ width:100%; max-width:150px; position:relative; }
  .gauge-wrap svg{ width:100%; height:auto; display:block; }
  .gauge-value{
    position:absolute;
    left:0; right:0; bottom:2px;
    text-align:center;
    font-family:"Onest","Golos Text",system-ui,sans-serif;
    font-weight:800;
    font-size:22px;
    font-variant-numeric:tabular-nums;
  }
  .gauge-needle{ transition:transform .6s cubic-bezier(.32,.02,.25,1); }
  .dept-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding-bottom:14px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .dept-name{
    font-family:"Onest","Golos Text",system-ui,sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:-.035em;
    margin:0 0 3px;
    color:var(--ink);
  }
  .dept-sub{
    font-size:12.5px;
    color:var(--muted);
  }

  .pct-pill{
    flex:none;
    font-weight:700;
    font-size:15px;
    padding:6px 12px;
    border-radius:10px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .pct-pill{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 12%,transparent);}
  .pct-pill.small{font-size:12.5px; padding:4px 9px; border-radius:8px;}
  .pct-good{color:var(--good); background:var(--good-bg);}
  .pct-warn{color:var(--warn); background:var(--warn-bg);}
  .pct-bad {color:var(--bad);  background:var(--bad-bg);}

  .mgr-row{
    display:grid;
    grid-template-columns:112px 1fr auto;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .mgr-row:last-child{border-bottom:none;}
  .mgr-name{
    font-weight:700;
    font-size:14.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .mgr-bar{
    position:relative;
    height:9px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:visible;
  }
  .mgr-bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px;
    overflow:hidden;
    background:linear-gradient(90deg,color-mix(in srgb,var(--bar-color) 56%,var(--surface)),var(--bar-color));
  }
  .mgr-figures{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .mgr-row .pct-cell{
    display:flex;
    align-items:center;
    gap:6px;
    justify-self:end;
  }
  @media (max-width:520px){
    .mgr-row{grid-template-columns:1fr; row-gap:6px;}
    .mgr-row .pct-cell{justify-self:start;}
  }

  /* ---- fire reward, shown on rows meeting plan ---- */
  .fire-icon{
    display:inline-block;
    width:44px; height:44px;
    flex:none;
    animation:flicker 1.3s ease-in-out infinite;
    transform-origin:50% 100%;
  }
  @keyframes flicker{
    0%,100%{ transform:scale(1,1) rotate(0deg); }
    35%    { transform:scale(1.06,.94) rotate(-1.5deg); }
    65%    { transform:scale(.95,1.06) rotate(1.5deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .fire-icon{ animation:none; }
  }

  /* ---- stat tiles ---- */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-bottom:22px;
  }
  @media (max-width:920px){
    .stats{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .stats{grid-template-columns:1fr;}
  }
  .mascot-inline{
    flex:0 0 auto;
    width:clamp(36px,6vw,76px);
    margin-left:auto;
  }
  .mascot-inline svg{display:block;width:100%;height:auto;color:var(--bad);}
  .stat-card{
    background:linear-gradient(145deg,var(--surface) 30%,var(--card-cool));
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .stat-card:nth-child(2){background:linear-gradient(145deg,var(--surface) 25%,var(--card-mint));}
  .stat-card.warn-tile{background:linear-gradient(145deg,var(--surface) 25%,var(--card-rose));}
  .stat-icon{
    flex:none;
    width:56px;height:56px;
    border-radius:16px;
    background:linear-gradient(145deg,var(--surface),var(--icon-mint));
    box-shadow:inset 0 0 0 1px var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--good);
  }
  .stat-icon svg{width:30px;height:30px;}
  .stat-icon.illustrated{
    color:var(--blue);
    background:linear-gradient(145deg,var(--surface),var(--icon-cool));
  }
  .stat-card.warn-tile .stat-icon{
    color:var(--bad);
    background:linear-gradient(145deg,var(--surface),var(--icon-rose));
  }
  .stat-label{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    margin:0 0 4px;
  }
  .stat-number{
    font-family:"Onest","Golos Text",system-ui,sans-serif;
    font-weight:800;
    font-size:36px;
    line-height:1;
    letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
  }
  .stat-card.warn-tile .stat-number{ color:var(--bad); }
  .stat-sub{
    margin-top:4px;
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  footer{
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    padding-top:6px;
  }
  body{
    background:
      radial-gradient(ellipse at 10% 0%,rgba(91,185,170,.16),transparent 36rem),
      radial-gradient(ellipse at 95% 3%,rgba(124,123,223,.20),transparent 34rem),
      var(--bg);
  }
  .topband{
    height:6px;
    background:linear-gradient(90deg,#eb456f,#ffca61,#55d5ae,#5d9eff,#c678ee);
  }
  .dept-card, .stat-card, .mini-stat{
    position:relative;
    padding-top:48px;
    overflow:hidden;
  }
  .holiday-garland{
    position:absolute;
    inset:0 0 auto;
    display:flex;
    height:46px;
    overflow:hidden;
    pointer-events:none;
  }
  .holiday-garland::after{
    content:"";
    position:absolute;
    inset:0 0 auto;
    height:7px;
    background:
      radial-gradient(ellipse at 26% 0%,#e3f4ff 0 68%,transparent 71%) 0 0/37px 6px repeat-x,
      linear-gradient(#f7fcff,#e3f4ff) top/100% 3px no-repeat;
  }
  .garland-loop{
    flex:1 0 74px;
    height:22px;
    position:relative;
    border-bottom:1.5px solid #247957;
    border-radius:0 0 50% 50% / 0 0 90% 90%;
  }
  .garland-bulb{
    position:absolute;
    width:6px;
    height:9px;
    border-radius:48% 48% 55% 55%;
    background:radial-gradient(circle at 35% 32%,#fff9 0 10%,transparent 50%),var(--bulb);
    box-shadow:0 1px 8px 2px var(--bulb);
    animation:holiday-glow 3.6s ease-in-out infinite alternate;
    animation-delay:var(--phase);
  }
  .garland-bulb::before{
    content:"";
    position:absolute;
    width:4px;
    height:2px;
    top:-1px;
    left:1px;
    border-radius:1px;
    background:#315845;
  }
  .garland-bulb:nth-child(1){left:10%;top:10px;transform:rotate(24deg);}
  .garland-bulb:nth-child(2){left:28%;top:18px;transform:rotate(12deg);}
  .garland-bulb:nth-child(3){left:46%;top:20px;}
  .garland-bulb:nth-child(4){left:64%;top:18px;transform:rotate(-12deg);}
  .garland-bulb:nth-child(5){left:82%;top:11px;transform:rotate(-24deg);}
  @keyframes holiday-glow{
    0%,15%{opacity:.46;box-shadow:0 0 2px var(--bulb);}
    65%,100%{opacity:1;box-shadow:0 1px 9px 2px var(--bulb);}
  }
  .garland-stocking{
    position:absolute;
    top:18px;
    left:60%;
    width:15px;
    height:25px;
    overflow:visible;
    transform:rotate(9deg);
    filter:drop-shadow(0 2px 2px #27395838);
  }
  .garland-loop:nth-child(even) .garland-stocking{transform:rotate(-9deg);}
  .holiday-grove{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr)) minmax(72px,1.35fr) repeat(2,minmax(0,1fr));
    align-items:end;
    justify-items:center;
    gap:clamp(3px,2vw,24px);
    width:min(100%,720px);
    margin:0 auto 12px;
    pointer-events:none;
  }
  .holiday-snowmen{width:100%;max-width:156px;}
  .holiday-snowmen svg{
    display:block;
    width:100%;
    filter:drop-shadow(0 4px 4px #3955822e);
  }
  .snowman-arm{transform-box:view-box;}
  .holiday-snowmen.is-sparring .snowman-arm{animation:holiday-spar 2.4s ease-in-out both;}
  .snowman-arm:first-of-type{transform-origin:54px 33px;--swing:42deg;}
  .snowman-arm:nth-of-type(2){transform-origin:85px 37px;--swing:-42deg;}
  .holiday-snowmen.is-sparring .snowman-arm:nth-of-type(2){animation-delay:.22s;}
  @keyframes holiday-spar{
    0%,100%{transform:rotate(0);}
    20%,51%,78%{transform:rotate(var(--swing));}
    35%,64%{transform:rotate(calc(0deg - var(--swing) / 3));}
  }

  .holiday-tree{
    position:relative;
    isolation:isolate;
    width:100%;
    max-width:var(--tree-width);
    aspect-ratio:1 / 1.2;
    --tree-width:116px;
    --tree-tint:0deg;
    --light:#ffe383;
    --light-alt:#ff89af;
  }
  .holiday-tree.icy{
    --tree-width:96px;--tree-tint:16deg;--light:#a2edff;--light-alt:#b6a7ff;
  }
  .holiday-tree.rose{
    --tree-width:106px;--tree-tint:-12deg;--light:#ff9cc9;--light-alt:#fff1a3;
  }
  .holiday-tree.mint{
    --tree-width:90px;--tree-tint:8deg;--light:#a5ffe8;--light-alt:#ffd078;
  }
  .tree-crown{
    position:absolute;
    inset:0;
    transform-origin:50% 90%;
  }
  .tree-crown img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    filter:hue-rotate(var(--tree-tint)) drop-shadow(0 5px 6px #258a703b);
  }
  .holiday-tree.is-shaking .tree-crown{animation:holiday-shake 1.4s ease-in-out;}
  .tree-light{
    position:absolute;
    width:clamp(3px,1vw,6px);
    aspect-ratio:1;
    border-radius:50%;
    --bulb:var(--light);
    background:var(--bulb);
    animation:holiday-glow 1.8s ease-in-out infinite alternate;
  }
  .tree-light:nth-of-type(even){--bulb:var(--light-alt);}
  .tree-light:nth-of-type(1){left:41%;top:36%;animation-delay:-.4s;}
  .tree-light:nth-of-type(2){left:58%;top:42%;animation-delay:-1.6s;}
  .tree-light:nth-of-type(3){left:32%;top:53%;animation-delay:-1.1s;}
  .tree-light:nth-of-type(4){left:49%;top:59%;animation-delay:-.3s;}
  .tree-light:nth-of-type(5){left:67%;top:55%;animation-delay:-.9s;}
  .tree-light:nth-of-type(6){left:24%;top:68%;animation-delay:-1.5s;}
  .tree-light:nth-of-type(7){left:42%;top:74%;animation-delay:-.6s;}
  .tree-light:nth-of-type(8){left:62%;top:73%;animation-delay:-1.2s;}
  .tree-light:nth-of-type(9){left:74%;top:68%;animation-delay:-.2s;}
  @keyframes holiday-shake{
    0%,100%{transform:rotate(0);}
    17%{transform:rotate(-5deg);}
    34%{transform:rotate(5deg);}
    50%{transform:rotate(-3deg);}
    67%{transform:rotate(2deg);}
    82%{transform:rotate(-1deg);}
  }

  .holiday-snow{
    position:fixed;
    inset:0;
    z-index:2;
    overflow:hidden;
    pointer-events:none;
  }
  .snowflake, .tree-snow{
    position:absolute;
    width:var(--size);
    height:var(--size);
    border-radius:50%;
    background:#f9fdff;
    box-shadow:0 0 4px #609ac8a0;
  }
  .snowflake{
    top:-10px;
    left:var(--left);
    animation:holiday-snowfall var(--duration) var(--phase) linear infinite;
  }
  @keyframes holiday-snowfall{
    from{transform:translate3d(0,0,0);opacity:.72;}
    52%{transform:translate3d(var(--drift),52vh,0);opacity:.84;}
    to{transform:translate3d(0,calc(100vh + 20px),0);opacity:.5;}
  }
  .tree-snow{
    pointer-events:none;
    z-index:1;
    animation:holiday-snow-shed 1.65s var(--phase) ease-in both;
  }
  @keyframes holiday-snow-shed{
    0%{transform:translate(0,0);opacity:0;}
    12%{opacity:1;}
    70%{opacity:.9;}
    100%{transform:translate(var(--drift),var(--drop));opacity:0;}
  }
  @media (max-width:620px){
    .topbar .meta{align-items:flex-start;}
  }
  @media (max-width:360px){
    .stat-card{gap:12px;padding-inline:14px;}
    .stat-icon{width:44px;height:44px;border-radius:13px;}
  }
  @media (prefers-reduced-motion:reduce){
    .garland-bulb{animation:none;}
    .holiday-snow,.tree-snow{display:none;}
    .holiday-tree.is-shaking .tree-crown,.tree-light,.holiday-snowmen.is-sparring .snowman-arm{animation:none;}
  }
</style>

<div class="topband"></div>
<div class="holiday-snow" aria-hidden="true"></div>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v5h-5.5v11h-5V9H4V4Z"/></svg>
      </div>
      <div>
        <h1>PERTiX</h1>
        <p class="tagline">Продажи · нарастающим итогом с начала года</p>
      </div>
    </div>
    <div class="meta">
      <div class="month-badge" id="monthBadge">—</div>
      <div class="updated" id="updated"><span class="dot"></span><span id="updatedText">—</span></div>
    </div>
  </div>

  <div class="depts" id="depts"></div>

  <div class="holiday-grove" aria-hidden="true">
    <div class="holiday-tree icy">
      <div class="tree-crown">

<script>
  const DATA = {"updatedAt": "2026-11-26T16:22:37.516911+03:00", "currentMonth": "Ноябрь", "departments": [{"name": "ГОСТ", "managers": [{"name": "Угольников", "plan": 57000000, "fact": 57973144, "pct": 101.7}, {"name": "Филаретова", "plan": 41355000, "fact": 44648889, "pct": 108.0}, {"name": "Муканян", "plan": 2000000, "fact": 3182641, "pct": 159.1}], "totals": {"plan": 155355000, "fact": 135041756}}, {"name": "Проектный", "managers": [{"name": "Якунин", "plan": 78775000, "fact": 51514930, "pct": 65.4}, {"name": "Роганин", "plan": 69500000, "fact": 12943252, "pct": 18.6}, {"name": "Маркова", "plan": 69500000, "fact": 53242840, "pct": 76.6}, {"name": "Малашкин", "plan": 69500000, "fact": 92168518, "pct": 132.6}, {"name": "Извекова", "plan": 29700000, "fact": 51378006, "pct": 173.0}, {"name": "Ерицян", "plan": 29700000, "fact": 25537464, "pct": 86.0}]}], "shipments": {"count": 729}, "lateShipments": {"count": 65}, "production": {"count": 10, "sum": 8216729}, "leadGen": {"totalInquiries": 7553, "conversionPct": 33.9}, "applicationConversionPct": 26.47, "sourceUpdatedAt": "2026-11-26T15:28:03+03:00"};

  function fmtMoney(n){
    return new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₽';
  }
  function fmtPct(p, digits = 1){
    return p.toLocaleString('ru-RU', {minimumFractionDigits:digits, maximumFractionDigits:digits}) + '%';
  }
  function fmtInt(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
  }
  function tier(p){
    if (p < 70) return 'bad';
    if (p < 90) return 'warn';
    return 'good';
  }

  function fireSVG(){
    return `
    <svg class="fire-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2c-2.2 3.4-5 6-5 10a5 5 0 0 0 10 0c0-1.6-.5-3-1.4-4.2.3 2-.8 3.4-1.8 4C14.2 8.6 12.6 6 12 2Z" fill="#e8412f"/>
      <path d="M12 7.5c-1 1.8-2.3 3.2-2.3 5a2.3 2.3 0 0 0 4.6 0c0-.9-.3-1.7-.8-2.4.1 1-.4 1.8-1 2.1C13 10.4 12.4 9 12 7.5Z" fill="#f7931e"/>
      <path d="M12.1 13.4c-.5.9-1 1.7-1 2.4a1.1 1.1 0 0 0 2.2 0c0-.4-.1-.9-.4-1.2 0 .4-.2.7-.5.8.1-.7-.1-1.4-.3-2Z" fill="#ffd23f"/>
    </svg>`;
  }

  function renderDept(dept){
    const totalPlan = dept.totals?.plan ?? dept.managers.reduce((s,m)=>s+m.plan,0);
    const totalFact = dept.totals?.fact ?? dept.managers.reduce((s,m)=>s+m.fact,0);
    const totalPct = totalPlan ? (totalFact/totalPlan*100) : 0;
    const tTier = tier(totalPct);

    const mascot = fireSVG;
    const rows = dept.managers.map(m => {
      const t = tier(m.pct);
      const width = Math.min(m.pct, 100);
      return `
        <div class="mgr-row">
          <div class="mgr-name">${m.name}</div>
          <div>
            <div class="mgr-bar"><div class="mgr-bar-fill" style="width:${width}%;--bar-color:var(--${t})"></div></div>
            <div class="mgr-figures num"><span>план ${fmtMoney(m.plan)}</span><span>&rarr; факт ${fmtMoney(m.fact)}</span></div>
          </div>
          <div class="pct-cell">
            ${t === 'good' ? mascot() : ''}
            <div class="pct-pill small pct-${t}">${fmtPct(m.pct)}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <section class="dept-card">
        <div class="dept-head">
          <div>
            <h2 class="dept-name">${dept.name}</h2>
            <div class="dept-sub">план <span class="num">${fmtMoney(totalPlan)}</span> &middot; факт <span class="num">${fmtMoney(totalFact)}</span></div>
          </div>
          <div class="pct-pill pct-${tTier}">${fmtPct(totalPct)}</div>
        </div>
        ${rows}
      </section>`;
  }

  let gaugeSeq = 0;
  function gaugeSVG(valuePct, digits = 1){
    const max = 45;
    const clamped = Math.max(0, Math.min(valuePct, max));
    const deg = (clamped / max) * 180 - 90;
    const gradId = 'gauge-grad-' + (gaugeSeq++);
    return `
      <div class="gauge-wrap">
        <svg viewBox="0 0 120 66" aria-hidden="true">
          <defs>
            <linearGradient id="${gradId}" gradientUnits="userSpaceOnUse" x1="10" y1="60" x2="110" y2="60">
              <stop offset="0%" stop-color="#d47591"/>
              <stop offset="27%" stop-color="#f0a860"/>
              <stop offset="50%" stop-color="#e8c467"/>
              <stop offset="73%" stop-color="#94c7aa"/>
              <stop offset="100%" stop-color="#53ad90"/>
            </linearGradient>
          </defs>
          <path d="M10,60 A50,50 0 0,1 110,60" fill="none" stroke="${'url(#' + gradId + ')'}" stroke-width="10" stroke-linecap="round"/>
          ${valuePct == null ? '' : `<line class="gauge-needle" x1="60" y1="60" x2="60" y2="19" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" transform="rotate(${deg} 60 60)"/>`}
          <circle cx="60" cy="60" r="5" fill="var(--ink)"/>
        </svg>
        <div class="gauge-value num">${valuePct == null ? '—' : fmtPct(valuePct, digits)}</div>
      </div>`;
  }

  function renderMiniStats(data){
    const lg = data.leadGen || {totalInquiries: null, conversionPct: 0};
    return `
      <div class="mini-stats">
        <div class="mini-stat">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2H7.2L4 15v-2.5H4a2 2 0 0 1-2-2V6Z"/>
              <path d="M4.7 7.2h4.6M4.7 9.4h3"/>
              <path d="M9.5 3.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1l-3 2.6v-2.6h-4a2 2 0 0 1-2-2v-6Z" fill="var(--surface)"/>
              <path d="M13 11.3v-3.2l1.5-2.1c.25-.35.8-.25.9.15l.15.85h1.6c.55 0 .95.5.8 1.05l-.5 2.05a.9.9 0 0 1-.85.65H13Z" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <p class="stat-label">Всего обращений</p>
          <div class="stat-number num">${lg.totalInquiries == null ? '—' : fmtInt(lg.totalInquiries)}</div>
        </div>
        <div class="mini-stat">
          <p class="stat-label">Конверсия лидов</p>
          ${gaugeSVG(lg.conversionPct)}
        </div>
        <div class="mini-stat">
          <p class="stat-label">Конверсия заявок</p>
          ${gaugeSVG(data.applicationConversionPct, 2)}
        </div>
      </div>`;
  }

  function decorateCard(card){
    if (card.querySelector('.holiday-garland')) return;
    const colors = ['#ff557b','#ffca57','#55e5a5','#62bbff','#db8aff'];
    const garland = document.createElement('div');
    garland.className = 'holiday-garland';
    garland.setAttribute('aria-hidden', 'true');

    for (let offset = 0; offset < 10; offset++) {
      const loop = document.createElement('span');
      loop.className = 'garland-loop';
      colors.forEach((_, index) => {
        const bulb = document.createElement('i');
        bulb.className = 'garland-bulb';
        bulb.style.setProperty('--bulb', colors[(index + offset * 2) % colors.length]);
        bulb.style.setProperty('--phase', `-${(index * 0.63 + offset * 0.91) % 3.6}s`);
        loop.append(bulb);
      });
      if (offset % 3 === 0) {
        loop.insertAdjacentHTML('beforeend', `<svg class="garland-stocking" viewBox="0 0 16 26" fill="none" aria-hidden="true">
          <path d="M10 5V1a1 1 0 0 1 2 0v4" stroke="#bd945b" stroke-width="1.2"/>
          <path d="M6 7h8v11c0 3-2 5-5 5H5a3.5 3.5 0 0 1 0-7h1Z" fill="${offset % 2 ? '#548c81' : '#be476e'}"/>
          <path d="M8 13h4m-2-2v4M4 19h3" stroke="#ffd99a" stroke-width="1" stroke-linecap="round"/>
          <rect x="5" y="5" width="10" height="4" rx="1.5" fill="#fff6e6"/>
        </svg>`);
      }
      garland.append(loop);
    }
    card.prepend(garland);
  }

  function decorateCards(){
    document.querySelectorAll('.dept-card,.mini-stat,.stat-card').forEach(decorateCard);
  }

  function mountHolidayAnimation(){
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const snow = document.querySelector('.holiday-snow');
    const trees = Array.from(document.querySelectorAll('.holiday-tree'));
    let treeIndex = 0;
    let shakeTimer;
    let cleanupTimer;

    function shakeTree(){
      if (!document.hidden) {
        const tree = trees[treeIndex];
        treeIndex = (treeIndex + 1) % trees.length;
        tree.classList.add('is-shaking');
        for (let index = 0; index < 14; index++) {
          const flake = document.createElement('i');
          flake.className = 'tree-snow';
          flake.style.left = `${20 + Math.random() * 60}%`;
          flake.style.top = `${20 + Math.random() * 57}%`;
          flake.style.setProperty('--size', `${2 + Math.random() * 5}px`);
          flake.style.setProperty('--phase', `${0.12 + Math.random() * 0.65}s`);
          flake.style.setProperty('--drop', `${24 + Math.random() * 43}px`);
          flake.style.setProperty('--drift', `${(Math.random() - .5) * 50}px`);
          tree.append(flake);
        }
        cleanupTimer = setTimeout(clearShake, 2400);
      }
      shakeTimer = setTimeout(shakeTree, 6500 + Math.random() * 3900);
    }

    function clearShake(){
      trees.forEach(tree => {
        tree.classList.remove('is-shaking');
        tree.querySelectorAll('.tree-snow').forEach(flake => flake.remove());
      });
    }

    function syncMotion(){
      clearTimeout(shakeTimer);
      clearTimeout(cleanupTimer);
      clearShake();
      snow.replaceChildren();
      if (motion.matches) return;

      const count = window.innerWidth < 620 ? 20 : 38;
      for (let index = 0; index < count; index++) {
        const flake = document.createElement('i');
        flake.className = 'snowflake';
        const duration = 10 + Math.random() * 14;
        flake.style.setProperty('--size', `${1.5 + Math.random() * 3.2}px`);
        flake.style.setProperty('--left', `${(index + Math.random()) * 100 / count}%`);
        flake.style.setProperty('--drift', `${(Math.random() - .5) * 90}px`);
        flake.style.setProperty('--duration', `${duration}s`);
        flake.style.setProperty('--phase', `-${Math.random() * duration}s`);
        snow.append(flake);
      }
      shakeTimer = setTimeout(shakeTree, 4000);
    }

    motion.addEventListener('change', syncMotion);
    syncMotion();
  }

  function render(data){
    if (!data) return;
    document.getElementById('depts').innerHTML = data.departments.map(dept => {
      const card = renderDept(dept);
      const extra = dept.name === 'ГОСТ' ? renderMiniStats(data) : '';
      return `<div class="dept-col">${card}${extra}</div>`;
    }).join('');
    document.getElementById('shipmentsCount').textContent = fmtInt(data.shipments.count);
    document.getElementById('productionCount').textContent = fmtInt(data.production.count);
    document.getElementById('productionSum').textContent = fmtMoney(data.production.sum);
    document.getElementById('lateShipmentsCount').textContent = fmtInt(data.lateShipments.count);
    document.getElementById('monthBadge').textContent = 'Янв – ' + (data.currentMonth || '').slice(0,3).toLowerCase();

    const updatedAt = new Date(data.updatedAt);
    const fmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    document.getElementById('updatedText').textContent = 'Обновлено ' + fmt.format(updatedAt);

    markStale(updatedAt);
    decorateCards();
  }

  function markStale(updatedAt){
    const staleMs = Date.now() - updatedAt.getTime();
    document.getElementById('updated').classList.toggle('stale', staleMs > 90*60*1000);
  }

  // GitHub Pages serves this file with a 10-minute CDN cache. A plain
  // visit/bookmark can land on a stale cached copy even right after a
  // fresh publish. If this load didn't already come from our own
  // cache-busted reload (no "?t=" param), immediately replace it with
  // one that has a unique query string, forcing a real network fetch.
  if (location.protocol.startsWith('http') && !location.search.includes('t=')) {
    location.replace(location.pathname + '?t=' + Date.now());
  }

  render(DATA);
  mountHolidayAnimation();
  if (DATA) setInterval(() => markStale(new Date(DATA.updatedAt)), 60000);

  // Give the snowmen time to finish before fetching the next static page.
  const snowmen = document.querySelector('.holiday-snowmen');
  const sparInterval = 5 * 60 * 1000;
  const sparDuration = 2800;

  function refreshDashboard(){
    window.location.href = window.location.pathname + '?t=' + Date.now();
  }

  if (location.protocol.startsWith('http')) {
    setTimeout(() => {
      if (document.hidden || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        refreshDashboard();
        return;
      }
      snowmen.classList.add('is-sparring');
      setTimeout(refreshDashboard, sparDuration);
    }, sparInterval);
  } else {
    setInterval(() => {
      snowmen.classList.add('is-sparring');
      setTimeout(() => snowmen.classList.remove('is-sparring'), sparDuration);
    }, sparInterval);
  }
</script>
