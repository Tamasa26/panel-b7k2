<title>Продажи PERTiX</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    /* PERTiX brand tokens — sampled from pertix.ru production CSS */
    --bg:#f3f4f9;
    --surface:#ffffff;
    --accent-light:#fff0f4;
    --ink:#181924;
    --muted:#5f6473;
    --line:#e3e7f0;
    --accent:#ff0037;
    --accent-ink:#ffffff;
    --blue:#1f51ff;
    --blue-light:#ecf0ff;
    --dark:#1f1f1f;
    --good:#1f8a4c; --good-bg:#e6f5ea;
    --warn:#b8790a; --warn-bg:#fff8e8;
    --bad:#ff0037;  --bad-bg:#fff0f4;
    --gold:#e8a63c;
    --radius-lg:22px;
    --radius-md:18px;
    --shadow: 0 18px 50px rgba(16,24,80,.09);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414;
      --surface:#1f1f1f;
      --accent-light:rgba(255,0,55,.16);
      --ink:#f4f4f5;
      --muted:#9a9aa5;
      --line:#333336;
      --accent:#ff0037;
      --accent-ink:#ffffff;
      --blue:#5578ff;
      --blue-light:rgba(31,81,255,.18);
      --dark:#0d0d0d;
      --good:#3fce82; --good-bg:rgba(63,206,130,.15);
      --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
      --bad:#ff2547;  --bad-bg:rgba(255,37,71,.18);
      --gold:#f0b954;
      --shadow: 0 18px 50px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141414;
    --surface:#1f1f1f;
    --accent-light:rgba(255,0,55,.16);
    --ink:#f4f4f5;
    --muted:#9a9aa5;
    --line:#333336;
    --accent:#ff0037;
    --accent-ink:#ffffff;
    --blue:#5578ff;
    --blue-light:rgba(31,81,255,.18);
    --dark:#0d0d0d;
    --good:#3fce82; --good-bg:rgba(63,206,130,.15);
    --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
    --bad:#ff2547;  --bad-bg:rgba(255,37,71,.18);
    --gold:#f0b954;
    --shadow: 0 18px 50px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-weight:600; }
  .topband{ height:5px; background:var(--accent); }
  .page{
    max-width:1280px;
    margin:0 auto;
    padding:24px 24px 40px;
  }

  /* ---- header ---- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:9px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:24px;height:24px;color:var(--accent-ink);}
  .brand h1{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:28px;
    line-height:1;
    letter-spacing:-.01em;
    margin:0 0 5px;
    text-wrap:balance;
  }
  .brand .tagline{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .month-badge{
    font-size:12px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#fff;
    background:radial-gradient(circle at 100% 0, rgba(255,0,55,.4), transparent 45%), var(--blue);
    padding:7px 13px;
    border-radius:999px;
  }
  .updated{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .updated .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--good);
    flex:none;
  }
  .updated.stale .dot{background:var(--warn);}

  /* ---- department cards ---- */
  .depts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
    align-items:start;
  }
  @media (max-width:860px){
    .depts{grid-template-columns:1fr;}
  }
  .dept-col{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .dept-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px 8px;
    box-shadow:var(--shadow);
  }

  /* ---- mini stat tiles under the ГОСТ card ---- */
  .mini-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .mini-stat{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:8px;
  }
  .mini-stat .stat-icon{ margin-bottom:2px; }
  .mini-stat .stat-label{ margin:0; }
  .mini-stat .stat-number{ font-size:30px; }
  .gauge-wrap{ width:100%; max-width:150px; position:relative; }
  .gauge-wrap svg{ width:100%; height:auto; display:block; }
  .gauge-value{
    position:absolute;
    left:0; right:0; bottom:2px;
    text-align:center;
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:22px;
    font-variant-numeric:tabular-nums;
  }
  .gauge-needle{ transition:transform .6s cubic-bezier(.32,.02,.25,1); }
  .dept-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding-bottom:14px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .dept-name{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:.01em;
    margin:0 0 3px;
    color:var(--ink);
  }
  .dept-sub{
    font-size:12.5px;
    color:var(--muted);
  }

  .pct-pill{
    flex:none;
    font-weight:700;
    font-size:15px;
    padding:6px 12px;
    border-radius:10px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .pct-pill.small{font-size:12.5px; padding:4px 9px; border-radius:8px;}
  .pct-good{color:var(--good); background:var(--good-bg);}
  .pct-warn{color:var(--warn); background:var(--warn-bg);}
  .pct-bad {color:var(--bad);  background:var(--bad-bg);}

  .mgr-row{
    display:grid;
    grid-template-columns:112px 1fr auto;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .mgr-row:last-child{border-bottom:none;}
  .mgr-name{
    font-weight:700;
    font-size:14.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .mgr-bar{
    position:relative;
    height:9px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:visible;
  }
  .mgr-bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px;
    overflow:hidden;
  }
  .mgr-figures{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .mgr-row .pct-cell{
    display:flex;
    align-items:center;
    gap:6px;
    justify-self:end;
  }
  @media (max-width:520px){
    .mgr-row{grid-template-columns:1fr; row-gap:6px;}
    .mgr-row .pct-cell{justify-self:start;}
  }

  /* ---- fire reward, shown on rows meeting plan ---- */
  .fire-icon{
    display:inline-block;
    width:44px; height:44px;
    flex:none;
    animation:flicker 1.3s ease-in-out infinite;
    transform-origin:50% 100%;
  }
  @keyframes flicker{
    0%,100%{ transform:scale(1,1) rotate(0deg); }
    35%    { transform:scale(1.06,.94) rotate(-1.5deg); }
    65%    { transform:scale(.95,1.06) rotate(1.5deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .fire-icon{ animation:none; }
  }

  /* ---- stat tiles ---- */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-bottom:22px;
  }
  @media (max-width:920px){
    .stats{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .stats{grid-template-columns:1fr;}
  }
  .mascot-inline{
    flex:0 0 auto;
    width:124px;
    margin-left:auto;
  }
  .mascot-inline svg{ width:100%; height:auto; overflow:visible; }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .stat-icon{
    flex:none;
    width:56px;height:56px;
    border-radius:16px;
    background:var(--accent-light);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .stat-icon svg{width:30px;height:30px;}
  .stat-icon.illustrated{ background:var(--blue-light); }
  .stat-card.warn-tile .stat-icon{color:var(--bad);}
  .stat-label{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 2px;
  }
  .stat-number{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:36px;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .stat-card.warn-tile .stat-number{ color:var(--bad); }
  .stat-sub{
    margin-top:4px;
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  footer{
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    padding-top:6px;
  }
</style>

<script>
  const DATA = {"updatedAt": "2026-09-10T20:50:02.092739+03:00", "currentMonth": "Сентябрь", "departments": [{"name": "ГОСТ", "managers": [{"name": "Кочураев", "plan": 45000000, "fact": 29213862, "pct": 64.9}, {"name": "Угольников", "plan": 45000000, "fact": 45491156, "pct": 101.1}, {"name": "Филаретова", "plan": 32655000, "fact": 35591918, "pct": 109.0}]}, {"name": "Проектный", "managers": [{"name": "Якунин", "plan": 69575000, "fact": 32994401, "pct": 47.4}, {"name": "Роганин", "plan": 58000000, "fact": 12510693, "pct": 21.6}, {"name": "Маркова", "plan": 58000000, "fact": 47489502, "pct": 81.9}, {"name": "Малашкин", "plan": 58000000, "fact": 71441127, "pct": 123.2}, {"name": "Извекова", "plan": 24900000, "fact": 25792448, "pct": 103.6}, {"name": "Ерицян", "plan": 24900000, "fact": 11012650, "pct": 44.2}]}], "shipments": {"count": 473}, "lateShipments": {"count": 55}, "production": {"count": 45, "sum": 65679222}, "leadGen": {"totalInquiries": 113, "conversionPct": 41.6}, "sourceUpdatedAt": "2026-09-10T16:23:01+03:00"};

  function fmtMoney(n){
    return new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₽';
  }
  function fmtPct(p){
    return p.toLocaleString('ru-RU', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  function fmtInt(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
  }
  function tier(p){
    if (p < 70) return 'bad';
    if (p < 90) return 'warn';
    return 'good';
  }

  function fireSVG(){
    return `
    <svg class="fire-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2c-2.2 3.4-5 6-5 10a5 5 0 0 0 10 0c0-1.6-.5-3-1.4-4.2.3 2-.8 3.4-1.8 4C14.2 8.6 12.6 6 12 2Z" fill="#e8412f"/>
      <path d="M12 7.5c-1 1.8-2.3 3.2-2.3 5a2.3 2.3 0 0 0 4.6 0c0-.9-.3-1.7-.8-2.4.1 1-.4 1.8-1 2.1C13 10.4 12.4 9 12 7.5Z" fill="#f7931e"/>
      <path d="M12.1 13.4c-.5.9-1 1.7-1 2.4a1.1 1.1 0 0 0 2.2 0c0-.4-.1-.9-.4-1.2 0 .4-.2.7-.5.8.1-.7-.1-1.4-.3-2Z" fill="#ffd23f"/>
    </svg>`;
  }

  function renderDept(dept){
    const totalPlan = dept.managers.reduce((s,m)=>s+m.plan,0);
    const totalFact = dept.managers.reduce((s,m)=>s+m.fact,0);
    const totalPct = totalPlan ? (totalFact/totalPlan*100) : 0;
    const tTier = tier(totalPct);

    const mascot = fireSVG;
    const rows = dept.managers.map(m => {
      const t = tier(m.pct);
      const width = Math.min(m.pct, 100);
      return `
        <div class="mgr-row">
          <div class="mgr-name">${m.name}</div>
          <div>
            <div class="mgr-bar"><div class="mgr-bar-fill" style="width:${width}%;background:var(--${t})"></div></div>
            <div class="mgr-figures num"><span>план ${fmtMoney(m.plan)}</span><span>&rarr; факт ${fmtMoney(m.fact)}</span></div>
          </div>
          <div class="pct-cell">
            ${t === 'good' ? mascot() : ''}
            <div class="pct-pill small pct-${t}">${fmtPct(m.pct)}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <section class="dept-card">
        <div class="dept-head">
          <div>
            <h2 class="dept-name">${dept.name}</h2>
            <div class="dept-sub">план <span class="num">${fmtMoney(totalPlan)}</span> &middot; факт <span class="num">${fmtMoney(totalFact)}</span></div>
          </div>
          <div class="pct-pill pct-${tTier}">${fmtPct(totalPct)}</div>
        </div>
        ${rows}
      </section>`;
  }

  let gaugeSeq = 0;
  function gaugeSVG(valuePct){
    const max = 45;
    const clamped = Math.max(0, Math.min(valuePct, max));
    const deg = (clamped / max) * 180 - 90;
    const gradId = 'gauge-grad-' + (gaugeSeq++);
    return `
      <div class="gauge-wrap">
        <svg viewBox="0 0 120 66" aria-hidden="true">
          <defs>
            <linearGradient id="${gradId}" gradientUnits="userSpaceOnUse" x1="10" y1="60" x2="110" y2="60">
              <stop offset="0%" stop-color="#ef6a5f"/>
              <stop offset="27%" stop-color="#f0a860"/>
              <stop offset="50%" stop-color="#e8c467"/>
              <stop offset="73%" stop-color="#b9cf6a"/>
              <stop offset="100%" stop-color="#6fbf73"/>
            </linearGradient>
          </defs>
          <path d="M10,60 A50,50 0 0,1 110,60" fill="none" stroke="${'url(#' + gradId + ')'}" stroke-width="10" stroke-linecap="round"/>
          <line class="gauge-needle" x1="60" y1="60" x2="60" y2="19" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" transform="rotate(${deg} 60 60)"/>
          <circle cx="60" cy="60" r="5" fill="var(--ink)"/>
        </svg>
        <div class="gauge-value num">${fmtPct(valuePct)}</div>
      </div>`;
  }

  function renderMiniStats(data){
    const lg = data.leadGen || {totalInquiries: 0, conversionPct: 0};
    return `
      <div class="mini-stats">
        <div class="mini-stat">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2H7.2L4 15v-2.5H4a2 2 0 0 1-2-2V6Z"/>
              <path d="M4.7 7.2h4.6M4.7 9.4h3"/>
              <path d="M9.5 3.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1l-3 2.6v-2.6h-4a2 2 0 0 1-2-2v-6Z" fill="var(--surface)"/>
              <path d="M13 11.3v-3.2l1.5-2.1c.25-.35.8-.25.9.15l.15.85h1.6c.55 0 .95.5.8 1.05l-.5 2.05a.9.9 0 0 1-.85.65H13Z" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <p class="stat-label">Всего обращений (сент)</p>
          <div class="stat-number num">${fmtInt(lg.totalInquiries)}</div>
        </div>
        <div class="mini-stat">
          <p class="stat-label">Конверсия лидов</p>
          ${gaugeSVG(lg.conversionPct)}
        </div>
      </div>`;
  }

  function render(data){
    if (!data) return;
    document.getElementById('depts').innerHTML = data.departments.map(dept => {
      const card = renderDept(dept);
      const extra = dept.name === 'ГОСТ' ? renderMiniStats(data) : '';
      return `<div class="dept-col">${card}${extra}</div>`;
    }).join('');
    document.getElementById('shipmentsCount').textContent = fmtInt(data.shipments.count);
    document.getElementById('productionCount').textContent = fmtInt(data.production.count);
    document.getElementById('productionSum').textContent = fmtMoney(data.production.sum);
    document.getElementById('lateShipmentsCount').textContent = fmtInt(data.lateShipments.count);
    document.getElementById('monthBadge').textContent = 'Янв – ' + (data.currentMonth || '').slice(0,3).toLowerCase();

    const updatedAt = new Date(data.updatedAt);
    const fmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    document.getElementById('updatedText').textContent = 'Обновлено ' + fmt.format(updatedAt);

    const staleMs = Date.now() - updatedAt.getTime();
    document.getElementById('updated').classList.toggle('stale', staleMs > 90*60*1000);
  }

  // GitHub Pages serves this file with a 10-minute CDN cache. A plain
  // visit/bookmark can land on a stale cached copy even right after a
  // fresh publish. If this load didn't already come from our own
  // cache-busted reload (no "?t=" param), immediately replace it with
  // one that has a unique query string, forcing a real network fetch.
  if (location.protocol.startsWith('http') && !location.search.includes('t=')) {
    location.replace(location.pathname + '?t=' + Date.now());
  }

  render(DATA);
  setInterval(() => render(DATA), 60000);

  // The page itself is a static file — an open tab never sees a new
  // publish on its own. Reload from the network every 5 minutes (with a
  // cache-busting query so a CDN/browser cache can't serve the old file)
  // so a screen left open all day picks up each hourly update.
  setInterval(() => {
    window.location.href = window.location.pathname + '?t=' + Date.now();
  }, 5 * 60 * 1000);
</script>
