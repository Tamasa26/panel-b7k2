<title>Продажи PERTiX</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#eef2f0;
    --surface:#ffffff;
    --surface-2:#f4f8f6;
    --ink:#16211f;
    --muted:#5c6d69;
    --line:#dde6e2;
    --accent:#1f6f6b;
    --accent-strong:#12494a;
    --good:#217a45; --good-bg:#e3f3e8;
    --warn:#a86a06; --warn-bg:#faf0da;
    --bad:#b13a24;  --bad-bg:#fbe9e4;
    --shadow: 0 1px 2px rgba(15,30,27,.04), 0 8px 24px -12px rgba(15,30,27,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1513;
      --surface:#12211e;
      --surface-2:#152a25;
      --ink:#eaf3ef;
      --muted:#8fa6a0;
      --line:#1f3a34;
      --accent:#4bc2b7;
      --accent-strong:#8fe0d6;
      --good:#59c37e; --good-bg:rgba(89,195,126,.14);
      --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.14);
      --bad:#e8735b;  --bad-bg:rgba(232,115,91,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1513;
    --surface:#12211e;
    --surface-2:#152a25;
    --ink:#eaf3ef;
    --muted:#8fa6a0;
    --line:#1f3a34;
    --accent:#4bc2b7;
    --accent-strong:#8fe0d6;
    --good:#59c37e; --good-bg:rgba(89,195,126,.14);
    --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.14);
    --bad:#e8735b;  --bad-bg:rgba(232,115,91,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums;
  }
  .page{
    max-width:1280px;
    margin:0 auto;
    padding:28px 24px 40px;
  }

  /* ---- header ---- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(155deg,var(--accent),var(--accent-strong));
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:22px;height:22px;color:var(--surface);}
  .brand h1{
    font-family:"Big Shoulders Display",sans-serif;
    font-weight:800;
    font-size:30px;
    line-height:1;
    letter-spacing:.01em;
    margin:0 0 4px;
    text-wrap:balance;
  }
  .brand .tagline{
    margin:0;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .month-badge{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent-strong);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:999px;
  }
  .updated{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .updated .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--good);
    flex:none;
  }
  .updated.stale .dot{background:var(--warn);}

  /* ---- department cards ---- */
  .depts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  @media (max-width:860px){
    .depts{grid-template-columns:1fr;}
  }
  .dept-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px 8px;
    box-shadow:var(--shadow);
  }
  .dept-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding-bottom:14px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .dept-name{
    font-family:"Big Shoulders Display",sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.03em;
    text-transform:uppercase;
    margin:0 0 3px;
    color:var(--ink);
  }
  .dept-sub{
    font-size:12.5px;
    color:var(--muted);
  }
  .dept-sub .mono{font-weight:500;}

  .pct-pill{
    flex:none;
    font-family:"IBM Plex Mono",monospace;
    font-weight:600;
    font-size:15px;
    padding:6px 12px;
    border-radius:10px;
    white-space:nowrap;
  }
  .pct-pill.small{font-size:12.5px; padding:4px 9px; border-radius:8px;}
  .pct-good{color:var(--good); background:var(--good-bg);}
  .pct-warn{color:var(--warn); background:var(--warn-bg);}
  .pct-bad {color:var(--bad);  background:var(--bad-bg);}

  .mgr-row{
    display:grid;
    grid-template-columns:118px 1fr 74px;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .mgr-row:last-child{border-bottom:none;}
  .mgr-name{
    font-weight:600;
    font-size:14.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .mgr-bar{
    position:relative;
    height:9px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .mgr-bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px 0 0 999px;
  }
  .mgr-bar-fill.full{border-radius:999px;}
  .mgr-figures{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .mgr-row .pct-pill{
    text-align:center;
    justify-self:end;
  }
  @media (max-width:520px){
    .mgr-row{grid-template-columns:1fr; row-gap:6px;}
    .mgr-row .pct-pill{justify-self:start;}
  }

  /* ---- stat tiles ---- */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:22px;
  }
  @media (max-width:640px){
    .stats{grid-template-columns:1fr;}
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:18px;
  }
  .stat-icon{
    flex:none;
    width:52px;height:52px;
    border-radius:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .stat-icon svg{width:26px;height:26px;}
  .stat-label{
    font-size:12.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin:0 0 2px;
  }
  .stat-number{
    font-family:"Big Shoulders Display",sans-serif;
    font-weight:800;
    font-size:40px;
    line-height:1;
  }
  .stat-sub{
    margin-top:4px;
    font-size:13px;
    color:var(--muted);
  }

  footer{
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    padding-top:6px;
  }
</style>

<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
      </div>
      <div>
        <h1>PERTiX</h1>
        <p class="tagline">Продажи · нарастающим итогом с начала года</p>
      </div>
    </div>
    <div class="meta">
      <div class="month-badge" id="monthBadge">—</div>
      <div class="updated" id="updated"><span class="dot"></span><span id="updatedText">—</span></div>
    </div>
  </div>

  <div class="depts" id="depts"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5V16l9 4.5 9-4.5V7.5"/><path d="M12 12v8.5"/></svg>
      </div>
      <div>
        <p class="stat-label">Отгрузок с начала года</p>
        <div class="stat-number mono" id="shipmentsCount">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19.5a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 17.85a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H2.5a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.15 6.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H8.6a1.7 1.7 0 0 0 1.04-1.56V.5"/></svg>
      </div>
      <div>
        <p class="stat-label">В производстве сейчас</p>
        <div class="stat-number mono" id="productionCount">—</div>
        <p class="stat-sub mono" id="productionSum">—</p>
      </div>
    </div>
  </div>

  <footer>Битрикс24 «План-факт (2026)» · Google Таблица «Производство» — обновляется автоматически раз в час</footer>
</div>

<script>
  const DATA = {"updatedAt": "2026-09-04T13:48:42.334771+03:00", "currentMonth": "Сентябрь", "departments": [{"name": "ГОСТ", "managers": [{"name": "Кочураев", "plan": 45000000, "fact": 28565098, "pct": 63.5}, {"name": "Угольников", "plan": 45000000, "fact": 43652233, "pct": 97.0}, {"name": "Филаретова", "plan": 32655000, "fact": 34307528, "pct": 105.1}]}, {"name": "Проектный", "managers": [{"name": "Якунин", "plan": 69575000, "fact": 25689903, "pct": 36.9}, {"name": "Роганин", "plan": 58000000, "fact": 10941042, "pct": 18.9}, {"name": "Маркова", "plan": 58000000, "fact": 47422784, "pct": 81.8}, {"name": "Малашкин", "plan": 58000000, "fact": 67884617, "pct": 117.0}, {"name": "Извекова", "plan": 24900000, "fact": 25792448, "pct": 103.6}, {"name": "Ерицян", "plan": 24900000, "fact": 11012650, "pct": 44.2}]}], "shipments": {"count": 445}, "production": {"count": 43, "sum": 58483277}, "sourceUpdatedAt": "2026-09-03T13:52:18+03:00"};

  function fmtMoney(n){
    return new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₽';
  }
  function fmtPct(p){
    return p.toLocaleString('ru-RU', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  function fmtInt(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
  }
  function tier(p){
    if (p < 70) return 'bad';
    if (p < 90) return 'warn';
    return 'good';
  }

  function renderDept(dept){
    const totalPlan = dept.managers.reduce((s,m)=>s+m.plan,0);
    const totalFact = dept.managers.reduce((s,m)=>s+m.fact,0);
    const totalPct = totalPlan ? (totalFact/totalPlan*100) : 0;
    const tTier = tier(totalPct);

    const rows = dept.managers.map(m => {
      const t = tier(m.pct);
      const width = Math.min(m.pct, 100);
      const full = m.pct >= 100 ? ' full' : '';
      return `
        <div class="mgr-row">
          <div class="mgr-name">${m.name}</div>
          <div>
            <div class="mgr-bar"><div class="mgr-bar-fill${full}" style="width:${width}%;background:var(--${t})"></div></div>
            <div class="mgr-figures mono"><span>план ${fmtMoney(m.plan)}</span><span>&rarr; факт ${fmtMoney(m.fact)}</span></div>
          </div>
          <div class="pct-pill small pct-${t}">${fmtPct(m.pct)}</div>
        </div>`;
    }).join('');

    return `
      <section class="dept-card">
        <div class="dept-head">
          <div>
            <h2 class="dept-name">${dept.name}</h2>
            <div class="dept-sub">план <span class="mono">${fmtMoney(totalPlan)}</span> &middot; факт <span class="mono">${fmtMoney(totalFact)}</span></div>
          </div>
          <div class="pct-pill pct-${tTier}">${fmtPct(totalPct)}</div>
        </div>
        ${rows}
      </section>`;
  }

  function render(data){
    if (!data) return;
    document.getElementById('depts').innerHTML = data.departments.map(renderDept).join('');
    document.getElementById('shipmentsCount').textContent = fmtInt(data.shipments.count);
    document.getElementById('productionCount').textContent = fmtInt(data.production.count);
    document.getElementById('productionSum').textContent = fmtMoney(data.production.sum);
    document.getElementById('monthBadge').textContent = 'Янв – ' + (data.currentMonth || '').slice(0,3).toLowerCase();

    const updatedAt = new Date(data.updatedAt);
    const fmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    document.getElementById('updatedText').textContent = 'Обновлено ' + fmt.format(updatedAt);

    const staleMs = Date.now() - updatedAt.getTime();
    document.getElementById('updated').classList.toggle('stale', staleMs > 90*60*1000);
  }

  render(DATA);
  setInterval(() => render(DATA), 60000);
</script>
