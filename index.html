<title>Продажи PERTiX</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#f1efec;
    --surface:#ffffff;
    --surface-2:#f6f3f1;
    --ink:#111111;
    --muted:#6b6b6b;
    --line:#e7e1dd;
    --accent:#ff0037;
    --accent-ink:#ffffff;
    --good:#1f8a4c; --good-bg:#e5f4ea;
    --warn:#b8790a; --warn-bg:#faf1dc;
    --bad:#ff0037;  --bad-bg:#ffe3e8;
    --gold:#e8a63c;
    --shadow: 0 1px 2px rgba(17,17,17,.05), 0 10px 24px -14px rgba(17,17,17,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0c0c;
      --surface:#161616;
      --surface-2:#1d1d1d;
      --ink:#f4f4f4;
      --muted:#9d9d9d;
      --line:#2b2b2b;
      --accent:#ff2547;
      --accent-ink:#ffffff;
      --good:#3fce82; --good-bg:rgba(63,206,130,.15);
      --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
      --bad:#ff2547;  --bad-bg:rgba(255,37,71,.16);
      --gold:#f0b954;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0c0c;
    --surface:#161616;
    --surface-2:#1d1d1d;
    --ink:#f4f4f4;
    --muted:#9d9d9d;
    --line:#2b2b2b;
    --accent:#ff2547;
    --accent-ink:#ffffff;
    --good:#3fce82; --good-bg:rgba(63,206,130,.15);
    --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
    --bad:#ff2547;  --bad-bg:rgba(255,37,71,.16);
    --gold:#f0b954;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-weight:600; }
  .topband{ height:5px; background:var(--accent); }
  .page{
    max-width:1280px;
    margin:0 auto;
    padding:24px 24px 40px;
  }

  /* ---- header ---- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:9px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:24px;height:24px;color:var(--accent-ink);}
  .brand h1{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:28px;
    line-height:1;
    letter-spacing:-.01em;
    margin:0 0 5px;
    text-wrap:balance;
  }
  .brand .tagline{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .month-badge{
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:999px;
  }
  .updated{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .updated .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--good);
    flex:none;
  }
  .updated.stale .dot{background:var(--warn);}

  /* ---- department cards ---- */
  .depts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  @media (max-width:860px){
    .depts{grid-template-columns:1fr;}
  }
  .dept-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px 8px;
    box-shadow:var(--shadow);
  }
  .dept-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding-bottom:14px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .dept-name{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:.01em;
    margin:0 0 3px;
    color:var(--ink);
  }
  .dept-sub{
    font-size:12.5px;
    color:var(--muted);
  }

  .pct-pill{
    flex:none;
    font-weight:700;
    font-size:15px;
    padding:6px 12px;
    border-radius:10px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .pct-pill.small{font-size:12.5px; padding:4px 9px; border-radius:8px;}
  .pct-good{color:var(--good); background:var(--good-bg);}
  .pct-warn{color:var(--warn); background:var(--warn-bg);}
  .pct-bad {color:var(--bad);  background:var(--bad-bg);}

  .mgr-row{
    display:grid;
    grid-template-columns:112px 1fr auto;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .mgr-row:last-child{border-bottom:none;}
  .mgr-name{
    font-weight:700;
    font-size:14.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .mgr-bar{
    position:relative;
    height:9px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:visible;
  }
  .mgr-bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px;
    overflow:hidden;
  }
  .mgr-figures{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .mgr-row .pct-cell{
    display:flex;
    align-items:center;
    gap:6px;
    justify-self:end;
  }
  @media (max-width:520px){
    .mgr-row{grid-template-columns:1fr; row-gap:6px;}
    .mgr-row .pct-cell{justify-self:start;}
  }

  /* ---- coin-jump reward, shown on rows meeting plan ---- */
  .coin-jump{
    position:relative;
    width:26px; height:22px;
    flex:none;
  }
  .coin-jump .coin{
    position:absolute; right:0; top:2px;
    width:11px; height:11px; border-radius:50%;
    background:var(--gold);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
    animation:coinspin 1.1s linear infinite;
  }
  .coin-jump .runner{
    position:absolute; left:0; bottom:0;
    width:12px; height:16px;
    animation:hop .55s ease-in-out infinite;
  }
  .coin-jump .runner .head{
    position:absolute; top:0; left:2px;
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
  }
  .coin-jump .runner .body{
    position:absolute; top:7px; left:1px;
    width:10px; height:7px; border-radius:3px;
    background:var(--ink);
  }
  .coin-jump .runner .leg{
    position:absolute; top:13px; width:3px; height:4px;
    background:var(--ink); border-radius:1px;
  }
  .coin-jump .runner .leg.l{left:1px;}
  .coin-jump .runner .leg.r{left:6px;}
  @keyframes hop{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    45%{ transform:translateY(-11px) rotate(-8deg); }
    70%{ transform:translateY(-11px) rotate(4deg); }
  }
  @keyframes coinspin{
    0%,100%{ transform:scaleX(1); }
    50%{ transform:scaleX(.25); }
  }
  @media (prefers-reduced-motion: reduce){
    .coin-jump .coin, .coin-jump .runner{ animation:none; }
  }

  /* ---- stat tiles ---- */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-bottom:22px;
  }
  @media (max-width:920px){
    .stats{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .stats{grid-template-columns:1fr;}
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .stat-icon{
    flex:none;
    width:54px;height:54px;
    border-radius:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .stat-icon svg{width:30px;height:30px;}
  .stat-card.warn-tile .stat-icon{color:var(--bad);}
  .stat-label{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 2px;
  }
  .stat-number{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:36px;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .stat-card.warn-tile .stat-number{ color:var(--bad); }
  .stat-sub{
    margin-top:4px;
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  footer{
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    padding-top:6px;
  }
</style>

<div class="topband"></div>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v5h-5.5v11h-5V9H4V4Z"/></svg>
      </div>
      <div>
        <h1>PERTiX</h1>
        <p class="tagline">Продажи · нарастающим итогом с начала года</p>
      </div>
    </div>
    <div class="meta">
      <div class="month-badge" id="monthBadge">—</div>
      <div class="updated" id="updated"><span class="dot"></span><span id="updatedText">—</span></div>
    </div>
  </div>

  <div class="depts" id="depts"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="4" y="30" width="13" height="10" rx="1" fill="currentColor"/>
          <rect x="18" y="24" width="13" height="16" rx="1" fill="currentColor" opacity=".55"/>
          <path d="M33 40V19a2 2 0 0 1 2-2h2.4a2 2 0 0 1 1.7.95L43 25v15" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <rect x="33" y="19" width="10" height="9" rx="1" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="38" cy="41" r="2.6" fill="currentColor"/>
          <circle cx="12" cy="41" r="2.6" fill="currentColor"/>
          <path d="M9 41h1M35 41h1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <p class="stat-label">Отгрузок с начала года</p>
        <div class="stat-number num" id="shipmentsCount">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19.5a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 17.85a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H2.5a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.15 6.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H8.6a1.7 1.7 0 0 0 1.04-1.56V.5"/></svg>
      </div>
      <div>
        <p class="stat-label">В производстве сейчас</p>
        <div class="stat-number num" id="productionCount">—</div>
        <p class="stat-sub num" id="productionSum">—</p>
      </div>
    </div>
    <div class="stat-card warn-tile">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><circle cx="12" cy="16.3" r="1" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <p class="stat-label">Несвоевременных отгрузок</p>
        <div class="stat-number num" id="lateShipmentsCount">—</div>
      </div>
    </div>
  </div>

  <footer>Битрикс24 «План-факт (2026)» · Google Таблица «Производство» — обновляется автоматически раз в час</footer>
</div>

<script>
  const DATA = {"updatedAt": "2026-09-04T14:01:38.146524+03:00", "currentMonth": "Сентябрь", "departments": [{"name": "ГОСТ", "managers": [{"name": "Кочураев", "plan": 45000000, "fact": 28565098, "pct": 63.5}, {"name": "Угольников", "plan": 45000000, "fact": 43652233, "pct": 97.0}, {"name": "Филаретова", "plan": 32655000, "fact": 34307528, "pct": 105.1}]}, {"name": "Проектный", "managers": [{"name": "Якунин", "plan": 69575000, "fact": 25689903, "pct": 36.9}, {"name": "Роганин", "plan": 58000000, "fact": 10941042, "pct": 18.9}, {"name": "Маркова", "plan": 58000000, "fact": 47422784, "pct": 81.8}, {"name": "Малашкин", "plan": 58000000, "fact": 67884617, "pct": 117.0}, {"name": "Извекова", "plan": 24900000, "fact": 25792448, "pct": 103.6}, {"name": "Ерицян", "plan": 24900000, "fact": 11012650, "pct": 44.2}]}], "shipments": {"count": 445}, "lateShipments": {"count": 55}, "production": {"count": 43, "sum": 58483277}, "sourceUpdatedAt": "2026-09-03T13:52:18+03:00"};

  function fmtMoney(n){
    return new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₽';
  }
  function fmtPct(p){
    return p.toLocaleString('ru-RU', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  function fmtInt(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
  }
  function tier(p){
    if (p < 70) return 'bad';
    if (p < 90) return 'warn';
    return 'good';
  }

  const coinJumpSVG = `
    <span class="coin-jump" aria-hidden="true">
      <span class="coin"></span>
      <span class="runner">
        <span class="head"></span>
        <span class="body"></span>
        <span class="leg l"></span>
        <span class="leg r"></span>
      </span>
    </span>`;

  function renderDept(dept){
    const totalPlan = dept.managers.reduce((s,m)=>s+m.plan,0);
    const totalFact = dept.managers.reduce((s,m)=>s+m.fact,0);
    const totalPct = totalPlan ? (totalFact/totalPlan*100) : 0;
    const tTier = tier(totalPct);

    const rows = dept.managers.map(m => {
      const t = tier(m.pct);
      const width = Math.min(m.pct, 100);
      return `
        <div class="mgr-row">
          <div class="mgr-name">${m.name}</div>
          <div>
            <div class="mgr-bar"><div class="mgr-bar-fill" style="width:${width}%;background:var(--${t})"></div></div>
            <div class="mgr-figures num"><span>план ${fmtMoney(m.plan)}</span><span>&rarr; факт ${fmtMoney(m.fact)}</span></div>
          </div>
          <div class="pct-cell">
            ${t === 'good' ? coinJumpSVG : ''}
            <div class="pct-pill small pct-${t}">${fmtPct(m.pct)}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <section class="dept-card">
        <div class="dept-head">
          <div>
            <h2 class="dept-name">${dept.name}</h2>
            <div class="dept-sub">план <span class="num">${fmtMoney(totalPlan)}</span> &middot; факт <span class="num">${fmtMoney(totalFact)}</span></div>
          </div>
          <div class="pct-pill pct-${tTier}">${fmtPct(totalPct)}</div>
        </div>
        ${rows}
      </section>`;
  }

  function render(data){
    if (!data) return;
    document.getElementById('depts').innerHTML = data.departments.map(renderDept).join('');
    document.getElementById('shipmentsCount').textContent = fmtInt(data.shipments.count);
    document.getElementById('productionCount').textContent = fmtInt(data.production.count);
    document.getElementById('productionSum').textContent = fmtMoney(data.production.sum);
    document.getElementById('lateShipmentsCount').textContent = fmtInt(data.lateShipments.count);
    document.getElementById('monthBadge').textContent = 'Янв – ' + (data.currentMonth || '').slice(0,3).toLowerCase();

    const updatedAt = new Date(data.updatedAt);
    const fmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    document.getElementById('updatedText').textContent = 'Обновлено ' + fmt.format(updatedAt);

    const staleMs = Date.now() - updatedAt.getTime();
    document.getElementById('updated').classList.toggle('stale', staleMs > 90*60*1000);
  }

  render(DATA);
  setInterval(() => render(DATA), 60000);
</script>
