<style>
  :root{
    /* PERTiX brand tokens — sampled from pertix.ru production CSS */
    --bg:#f3f4f9;
    --surface:#ffffff;
    --accent-light:#fff0f4;
    --ink:#181924;
    --muted:#5f6473;
    --line:#e3e7f0;
    --accent:#ff0037;
    --accent-ink:#ffffff;
    --blue:#1f51ff;
    --blue-light:#ecf0ff;
    --dark:#1f1f1f;
    --good:#1f8a4c; --good-bg:#e6f5ea;
    --warn:#b8790a; --warn-bg:#fff8e8;
    --bad:#ff0037;  --bad-bg:#fff0f4;
    --gold:#e8a63c;
    --radius-lg:22px;
    --radius-md:18px;
    --shadow: 0 18px 50px rgba(16,24,80,.09);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414;
      --surface:#1f1f1f;
      --accent-light:rgba(255,0,55,.16);
      --ink:#f4f4f5;
      --muted:#9a9aa5;
      --line:#333336;
      --accent:#ff0037;
      --accent-ink:#ffffff;
      --blue:#5578ff;
      --blue-light:rgba(31,81,255,.18);
      --dark:#0d0d0d;
      --good:#3fce82; --good-bg:rgba(63,206,130,.15);
      --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
      --bad:#ff2547;  --bad-bg:rgba(255,37,71,.18);
      --gold:#f0b954;
      --shadow: 0 18px 50px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141414;
    --surface:#1f1f1f;
    --accent-light:rgba(255,0,55,.16);
    --ink:#f4f4f5;
    --muted:#9a9aa5;
    --line:#333336;
    --accent:#ff0037;
    --accent-ink:#ffffff;
    --blue:#5578ff;
    --blue-light:rgba(31,81,255,.18);
    --dark:#0d0d0d;
    --good:#3fce82; --good-bg:rgba(63,206,130,.15);
    --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
    --bad:#ff2547;  --bad-bg:rgba(255,37,71,.18);
    --gold:#f0b954;
    --shadow: 0 18px 50px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-weight:600; }
  .topband{ height:5px; background:var(--accent); }
  .page{
    max-width:1280px;
    margin:0 auto;
    padding:24px 24px 40px;
  }

  /* ---- header ---- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:9px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:24px;height:24px;color:var(--accent-ink);}
  .brand h1{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:28px;
    line-height:1;
    letter-spacing:-.01em;
    margin:0 0 5px;
    text-wrap:balance;
  }
  .brand .tagline{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .month-badge{
    font-size:12px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#fff;
    background:radial-gradient(circle at 100% 0, rgba(255,0,55,.4), transparent 45%), var(--blue);
    padding:7px 13px;
    border-radius:999px;
  }
  .updated{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .updated .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--good);
    flex:none;
  }
  .updated.stale .dot{background:var(--warn);}

  /* ---- department cards ---- */
  .depts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  @media (max-width:860px){
    .depts{grid-template-columns:1fr;}
  }
  .dept-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px 8px;
    box-shadow:var(--shadow);
  }
  .dept-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding-bottom:14px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .dept-name{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:.01em;
    margin:0 0 3px;
    color:var(--ink);
  }
  .dept-sub{
    font-size:12.5px;
    color:var(--muted);
  }

  .pct-pill{
    flex:none;
    font-weight:700;
    font-size:15px;
    padding:6px 12px;
    border-radius:10px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .pct-pill.small{font-size:12.5px; padding:4px 9px; border-radius:8px;}
  .pct-good{color:var(--good); background:var(--good-bg);}
  .pct-warn{color:var(--warn); background:var(--warn-bg);}
  .pct-bad {color:var(--bad);  background:var(--bad-bg);}

  .mgr-row{
    display:grid;
    grid-template-columns:112px 1fr auto;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .mgr-row:last-child{border-bottom:none;}
  .mgr-name{
    font-weight:700;
    font-size:14.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .mgr-bar{
    position:relative;
    height:9px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:visible;
  }
  .mgr-bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px;
    overflow:hidden;
  }
  .mgr-figures{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .mgr-row .pct-cell{
    display:flex;
    align-items:center;
    gap:6px;
    justify-self:end;
  }
  @media (max-width:520px){
    .mgr-row{grid-template-columns:1fr; row-gap:6px;}
    .mgr-row .pct-cell{justify-self:start;}
  }

  /* ---- cheer-jump reward, shown on rows meeting plan ---- */
  .cheer-jump{
    display:inline-block;
    width:44px; height:44px;
    flex:none;
    animation:bag-hop .85s cubic-bezier(.32,.02,.5,1.4) infinite;
    transform-origin:50% 100%;
  }
  @keyframes bag-hop{
    0%   { transform:translateY(0) scale(1,1); }
    22%  { transform:translateY(0) scale(1.12,.85); }
    50%  { transform:translateY(-9px) scale(.94,1.06); }
    78%  { transform:translateY(0) scale(1.12,.85); }
    100% { transform:translateY(0) scale(1,1); }
  }
  @media (prefers-reduced-motion: reduce){
    .cheer-jump{ animation:none; }
  }

  /* ---- stat tiles ---- */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-bottom:22px;
  }
  @media (max-width:920px){
    .stats{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .stats{grid-template-columns:1fr;}
  }
  .mascot-inline{
    flex:0 0 auto;
    width:124px;
    margin-left:auto;
  }
  .mascot-inline svg{ width:100%; height:auto; overflow:visible; }
  .steam-wisp{ animation:steam-rise 2.6s ease-in-out infinite; transform-origin:50% 100%; }
  .steam-wisp.s2{ animation-delay:.5s; }
  .steam-wisp.s3{ animation-delay:1s; }
  @keyframes steam-rise{
    0%   { opacity:0; transform:translateY(2px) scaleY(.85); }
    35%  { opacity:.7; }
    75%  { opacity:.35; }
    100% { opacity:0; transform:translateY(-6px) scaleY(1.1); }
  }
  @media (prefers-reduced-motion: reduce){
    .steam-wisp{ animation:none; opacity:.5; }
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .stat-icon{
    flex:none;
    width:56px;height:56px;
    border-radius:16px;
    background:var(--accent-light);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .stat-icon svg{width:30px;height:30px;}
  .stat-icon.illustrated{ background:var(--blue-light); }
  .stat-card.warn-tile .stat-icon{color:var(--bad);}
  .stat-label{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 2px;
  }
  .stat-number{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:36px;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .stat-card.warn-tile .stat-number{ color:var(--bad); }
  .stat-sub{
    margin-top:4px;
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  footer{
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    padding-top:6px;
  }
</style>

  function renderDept(dept){
    const totalPlan = dept.managers.reduce((s,m)=>s+m.plan,0);
    const totalFact = dept.managers.reduce((s,m)=>s+m.fact,0);
    const totalPct = totalPlan ? (totalFact/totalPlan*100) : 0;
    const tTier = tier(totalPct);

    const mascot = dept.name === 'ГОСТ' ? tattooJumperSVG : cheerJumperSVG;
    const rows = dept.managers.map(m => {
      const t = tier(m.pct);
      const width = Math.min(m.pct, 100);
      return `
        <div class="mgr-row">
          <div class="mgr-name">${m.name}</div>
          <div>
            <div class="mgr-bar"><div class="mgr-bar-fill" style="width:${width}%;background:var(--${t})"></div></div>
            <div class="mgr-figures num"><span>план ${fmtMoney(m.plan)}</span><span>&rarr; факт ${fmtMoney(m.fact)}</span></div>
          </div>
          <div class="pct-cell">
            ${t === 'good' ? mascot() : ''}
            <div class="pct-pill small pct-${t}">${fmtPct(m.pct)}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <section class="dept-card">
        <div class="dept-head">
          <div>
            <h2 class="dept-name">${dept.name}</h2>
            <div class="dept-sub">план <span class="num">${fmtMoney(totalPlan)}</span> &middot; факт <span class="num">${fmtMoney(totalFact)}</span></div>
          </div>
          <div class="pct-pill pct-${tTier}">${fmtPct(totalPct)}</div>
        </div>
        ${rows}
      </section>`;
  }

  function render(data){
    if (!data) return;
    document.getElementById('depts').innerHTML = data.departments.map(renderDept).join('');
    document.getElementById('shipmentsCount').textContent = fmtInt(data.shipments.count);
    document.getElementById('productionCount').textContent = fmtInt(data.production.count);
    document.getElementById('productionSum').textContent = fmtMoney(data.production.sum);
    document.getElementById('lateShipmentsCount').textContent = fmtInt(data.lateShipments.count);
    document.getElementById('monthBadge').textContent = 'Янв – ' + (data.currentMonth || '').slice(0,3).toLowerCase();

    const updatedAt = new Date(data.updatedAt);
    const fmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    document.getElementById('updatedText').textContent = 'Обновлено ' + fmt.format(updatedAt);

    const staleMs = Date.now() - updatedAt.getTime();
    document.getElementById('updated').classList.toggle('stale', staleMs > 90*60*1000);
  }

  // GitHub Pages serves this file with a 10-minute CDN cache. A plain
  // visit/bookmark can land on a stale cached copy even right after a
  // fresh publish. If this load didn't already come from our own
  // cache-busted reload (no "?t=" param), immediately replace it with
  // one that has a unique query string, forcing a real network fetch.
  if (location.protocol.startsWith('http') && !location.search.includes('t=')) {
    location.replace(location.pathname + '?t=' + Date.now());
  }

  render(DATA);
  setInterval(() => render(DATA), 60000);

  // The page itself is a static file — an open tab never sees a new
  // publish on its own. Reload from the network every 5 minutes (with a
  // cache-busting query so a CDN/browser cache can't serve the old file)
  // so a screen left open all day picks up each hourly update.
  setInterval(() => {
    window.location.href = window.location.pathname + '?t=' + Date.now();
  }, 5 * 60 * 1000);
</script>
