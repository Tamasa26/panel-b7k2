<title>Продажи PERTiX</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    /* PERTiX brand tokens — sampled from pertix.ru production CSS */
    --bg:#f3f4f9;
    --surface:#ffffff;
    --accent-light:#fff0f4;
    --ink:#181924;
    --muted:#5f6473;
    --line:#e3e7f0;
    --accent:#ff0037;
    --accent-ink:#ffffff;
    --blue:#1f51ff;
    --blue-light:#ecf0ff;
    --dark:#1f1f1f;
    --good:#1f8a4c; --good-bg:#e6f5ea;
    --warn:#b8790a; --warn-bg:#fff8e8;
    --bad:#ff0037;  --bad-bg:#fff0f4;
    --gold:#e8a63c;
    --radius-lg:22px;
    --radius-md:18px;
    --shadow: 0 18px 50px rgba(16,24,80,.09);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414;
      --surface:#1f1f1f;
      --accent-light:rgba(255,0,55,.16);
      --ink:#f4f4f5;
      --muted:#9a9aa5;
      --line:#333336;
      --accent:#ff0037;
      --accent-ink:#ffffff;
      --blue:#5578ff;
      --blue-light:rgba(31,81,255,.18);
      --dark:#0d0d0d;
      --good:#3fce82; --good-bg:rgba(63,206,130,.15);
      --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
      --bad:#ff2547;  --bad-bg:rgba(255,37,71,.18);
      --gold:#f0b954;
      --shadow: 0 18px 50px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141414;
    --surface:#1f1f1f;
    --accent-light:rgba(255,0,55,.16);
    --ink:#f4f4f5;
    --muted:#9a9aa5;
    --line:#333336;
    --accent:#ff0037;
    --accent-ink:#ffffff;
    --blue:#5578ff;
    --blue-light:rgba(31,81,255,.18);
    --dark:#0d0d0d;
    --good:#3fce82; --good-bg:rgba(63,206,130,.15);
    --warn:#e3ab4c; --warn-bg:rgba(227,171,76,.15);
    --bad:#ff2547;  --bad-bg:rgba(255,37,71,.18);
    --gold:#f0b954;
    --shadow: 0 18px 50px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-weight:600; }
  .topband{ height:5px; background:var(--accent); }
  .page{
    max-width:1280px;
    margin:0 auto;
    padding:24px 24px 40px;
  }

  /* ---- header ---- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:9px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:24px;height:24px;color:var(--accent-ink);}
  .brand h1{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:28px;
    line-height:1;
    letter-spacing:-.01em;
    margin:0 0 5px;
    text-wrap:balance;
  }
  .brand .tagline{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .month-badge{
    font-size:12px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#fff;
    background:radial-gradient(circle at 100% 0, rgba(255,0,55,.4), transparent 45%), var(--blue);
    padding:7px 13px;
    border-radius:999px;
  }
  .updated{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .updated .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--good);
    flex:none;
  }
  .updated.stale .dot{background:var(--warn);}

  /* ---- department cards ---- */
  .depts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  @media (max-width:860px){
    .depts{grid-template-columns:1fr;}
  }
  .dept-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px 8px;
    box-shadow:var(--shadow);
  }
  .dept-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding-bottom:14px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .dept-name{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:.01em;
    margin:0 0 3px;
    color:var(--ink);
  }
  .dept-sub{
    font-size:12.5px;
    color:var(--muted);
  }

  .pct-pill{
    flex:none;
    font-weight:700;
    font-size:15px;
    padding:6px 12px;
    border-radius:10px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .pct-pill.small{font-size:12.5px; padding:4px 9px; border-radius:8px;}
  .pct-good{color:var(--good); background:var(--good-bg);}
  .pct-warn{color:var(--warn); background:var(--warn-bg);}
  .pct-bad {color:var(--bad);  background:var(--bad-bg);}

  .mgr-row{
    display:grid;
    grid-template-columns:112px 1fr auto;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .mgr-row:last-child{border-bottom:none;}
  .mgr-name{
    font-weight:700;
    font-size:14.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .mgr-bar{
    position:relative;
    height:9px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:visible;
  }
  .mgr-bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px;
    overflow:hidden;
  }
  .mgr-figures{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .mgr-row .pct-cell{
    display:flex;
    align-items:center;
    gap:6px;
    justify-self:end;
  }
  @media (max-width:520px){
    .mgr-row{grid-template-columns:1fr; row-gap:6px;}
    .mgr-row .pct-cell{justify-self:start;}
  }

  /* ---- money-bag reward, shown on rows meeting plan ---- */
  .money-bag{
    display:inline-block;
    width:22px; height:22px;
    flex:none;
    animation:bag-hop .85s cubic-bezier(.32,.02,.5,1.4) infinite;
    transform-origin:50% 100%;
  }
  @keyframes bag-hop{
    0%   { transform:translateY(0) scale(1,1); }
    22%  { transform:translateY(0) scale(1.12,.85); }
    50%  { transform:translateY(-9px) scale(.94,1.06); }
    78%  { transform:translateY(0) scale(1.12,.85); }
    100% { transform:translateY(0) scale(1,1); }
  }
  @media (prefers-reduced-motion: reduce){
    .money-bag{ animation:none; }
  }

  /* ---- stat tiles ---- */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-bottom:22px;
  }
  @media (max-width:920px){
    .stats{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .stats{grid-template-columns:1fr;}
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .stat-icon{
    flex:none;
    width:56px;height:56px;
    border-radius:16px;
    background:var(--accent-light);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .stat-icon svg{width:30px;height:30px;}
  .stat-icon.illustrated{ background:var(--blue-light); }
  .stat-card.warn-tile .stat-icon{color:var(--bad);}
  .stat-label{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 2px;
  }
  .stat-number{
    font-family:"Manrope",sans-serif;
    font-weight:800;
    font-size:36px;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .stat-card.warn-tile .stat-number{ color:var(--bad); }
  .stat-sub{
    margin-top:4px;
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  footer{
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    padding-top:6px;
  }
</style>

<div class="topband"></div>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v5h-5.5v11h-5V9H4V4Z"/></svg>
      </div>
      <div>
        <h1>PERTiX</h1>
        <p class="tagline">Продажи · нарастающим итогом с начала года</p>
      </div>
    </div>
    <div class="meta">
      <div class="month-badge" id="monthBadge">—</div>
      <div class="updated" id="updated"><span class="dot"></span><span id="updatedText">—</span></div>
    </div>
  </div>

  <div class="depts" id="depts"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon illustrated">
        <svg viewBox="0 0 64 48" width="34" height="26">
          <rect x="27" y="14" width="17" height="15" rx="1.2" fill="#c9975a"/>
          <rect x="27" y="14" width="17" height="15" rx="1.2" fill="#000" opacity=".06"/>
          <path d="M35.5 17.5v8M31 21.5h9" stroke="#8a6338" stroke-width="1.3"/>
          <path d="M39 18l2.4 2.6-4.8 0Z" fill="#8a6338"/>
          <rect x="30" y="29" width="26" height="4.5" rx="1" fill="#f5a623"/>
          <path d="M10 12 L30 25" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
          <rect x="27" y="24" width="5" height="9" rx="1.4" fill="#e8901a"/>
          <circle cx="8" cy="10" r="2.6" fill="#3a3a3a"/>
          <circle cx="34" cy="41" r="4" fill="#232323"/>
          <circle cx="34" cy="41" r="1.6" fill="#5a5a5a"/>
          <circle cx="54" cy="41" r="4" fill="#232323"/>
          <circle cx="54" cy="41" r="1.6" fill="#5a5a5a"/>
        </svg>
      </div>
      <div>
        <p class="stat-label">Отгрузок с начала года</p>
        <div class="stat-number num" id="shipmentsCount">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19.5a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 17.85a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H2.5a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.15 6.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H8.6a1.7 1.7 0 0 0 1.04-1.56V.5"/></svg>
      </div>
      <div>
        <p class="stat-label">В производстве сейчас</p>
        <div class="stat-number num" id="productionCount">—</div>
        <p class="stat-sub num" id="productionSum">—</p>
      </div>
    </div>
    <div class="stat-card warn-tile">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><circle cx="12" cy="16.3" r="1" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <p class="stat-label">Несвоевременных отгрузок</p>
        <div class="stat-number num" id="lateShipmentsCount">—</div>
      </div>
    </div>
  </div>

  <footer>Битрикс24 «План-факт (2026)» · Google Таблица «Производство» — обновляется автоматически раз в час</footer>
</div>

<script>
  const DATA = {"updatedAt": "2026-09-04T14:36:57.353010+03:00", "currentMonth": "Сентябрь", "departments": [{"name": "ГОСТ", "managers": [{"name": "Кочураев", "plan": 45000000, "fact": 28565098, "pct": 63.5}, {"name": "Угольников", "plan": 45000000, "fact": 43652233, "pct": 97.0}, {"name": "Филаретова", "plan": 32655000, "fact": 34307528, "pct": 105.1}]}, {"name": "Проектный", "managers": [{"name": "Якунин", "plan": 69575000, "fact": 136689903, "pct": 196.5}, {"name": "Роганин", "plan": 58000000, "fact": 10941042, "pct": 18.9}, {"name": "Маркова", "plan": 58000000, "fact": 47422784, "pct": 81.8}, {"name": "Малашкин", "plan": 58000000, "fact": 67884617, "pct": 117.0}, {"name": "Извекова", "plan": 24900000, "fact": 25792448, "pct": 103.6}, {"name": "Ерицян", "plan": 24900000, "fact": 11012650, "pct": 44.2}]}], "shipments": {"count": 445}, "lateShipments": {"count": 55}, "production": {"count": 43, "sum": 58483277}, "sourceUpdatedAt": "2026-09-04T14:35:06+03:00"};

  function fmtMoney(n){
    return new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₽';
  }
  function fmtPct(p){
    return p.toLocaleString('ru-RU', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  function fmtInt(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
  }
  function tier(p){
    if (p < 70) return 'bad';
    if (p < 90) return 'warn';
    return 'good';
  }

  const moneyBagSVG = `
    <svg class="money-bag" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9.3 8.6C7.1 10.3 5.5 12.9 5.5 15.4 5.5 18.8 8.3 21 12 21s6.5-2.2 6.5-5.6c0-2.5-1.6-5.1-3.8-6.8" fill="#a9764f" stroke="#7a5334" stroke-width=".7" stroke-linejoin="round"/>
      <path d="M9.4 8.7C9.1 6.6 10.3 5 12 5s2.9 1.6 2.6 3.7" fill="none" stroke="#7a5334" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="9.3" cy="7.2" r="1.5" fill="var(--gold)" stroke="#c9861f" stroke-width=".4"/>
      <circle cx="12.2" cy="5.9" r="1.8" fill="var(--gold)" stroke="#c9861f" stroke-width=".4"/>
      <circle cx="15" cy="7.4" r="1.4" fill="var(--gold)" stroke="#c9861f" stroke-width=".4"/>
      <path d="M9 14.5c.7.6 1.8 1 3 1s2.3-.4 3-1" fill="none" stroke="#7a5334" stroke-width=".8" stroke-linecap="round" opacity=".55"/>
    </svg>`;

  function renderDept(dept){
    const totalPlan = dept.managers.reduce((s,m)=>s+m.plan,0);
    const totalFact = dept.managers.reduce((s,m)=>s+m.fact,0);
    const totalPct = totalPlan ? (totalFact/totalPlan*100) : 0;
    const tTier = tier(totalPct);

    const rows = dept.managers.map(m => {
      const t = tier(m.pct);
      const width = Math.min(m.pct, 100);
      return `
        <div class="mgr-row">
          <div class="mgr-name">${m.name}</div>
          <div>
            <div class="mgr-bar"><div class="mgr-bar-fill" style="width:${width}%;background:var(--${t})"></div></div>
            <div class="mgr-figures num"><span>план ${fmtMoney(m.plan)}</span><span>&rarr; факт ${fmtMoney(m.fact)}</span></div>
          </div>
          <div class="pct-cell">
            ${t === 'good' ? moneyBagSVG : ''}
            <div class="pct-pill small pct-${t}">${fmtPct(m.pct)}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <section class="dept-card">
        <div class="dept-head">
          <div>
            <h2 class="dept-name">${dept.name}</h2>
            <div class="dept-sub">план <span class="num">${fmtMoney(totalPlan)}</span> &middot; факт <span class="num">${fmtMoney(totalFact)}</span></div>
          </div>
          <div class="pct-pill pct-${tTier}">${fmtPct(totalPct)}</div>
        </div>
        ${rows}
      </section>`;
  }

  function render(data){
    if (!data) return;
    document.getElementById('depts').innerHTML = data.departments.map(renderDept).join('');
    document.getElementById('shipmentsCount').textContent = fmtInt(data.shipments.count);
    document.getElementById('productionCount').textContent = fmtInt(data.production.count);
    document.getElementById('productionSum').textContent = fmtMoney(data.production.sum);
    document.getElementById('lateShipmentsCount').textContent = fmtInt(data.lateShipments.count);
    document.getElementById('monthBadge').textContent = 'Янв – ' + (data.currentMonth || '').slice(0,3).toLowerCase();

    const updatedAt = new Date(data.updatedAt);
    const fmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    document.getElementById('updatedText').textContent = 'Обновлено ' + fmt.format(updatedAt);

    const staleMs = Date.now() - updatedAt.getTime();
    document.getElementById('updated').classList.toggle('stale', staleMs > 90*60*1000);
  }

  render(DATA);
  setInterval(() => render(DATA), 60000);

  // The page itself is a static file — an open tab never sees a new
  // publish on its own. Reload from the network every 5 minutes (with a
  // cache-busting query so a CDN/browser cache can't serve the old file)
  // so a screen left open all day picks up each hourly update.
  setInterval(() => {
    window.location.href = window.location.pathname + '?t=' + Date.now();
  }, 5 * 60 * 1000);
</script>
